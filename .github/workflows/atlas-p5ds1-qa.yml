name: ATLAS P5DS1 Roadmap QA

on:
  push:
    branches:
      - ops/atlas-p5ds1-qa-20260920

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact Product candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object atlas-exit/parcours-usa.html)" = "1589d7d96826ef2e5bc54790a9614d9ad36765eb"
          test "$(git hash-object atlas-exit/atlas-ui.css)" = "a4af3e0236c6622a5488fa7836bca100922f382f"
          test "$(git hash-object atlas-exit/parcours-usa.js)" = "c28941375f4c2b87183e816d65bb3ae66d4c15e3"
          test "$(git hash-object atlas-exit/atlas-events.js)" = "acdc41734734c21bddf71f0e05047265274a74ec"
          ! grep -q '<style' atlas-exit/parcours-usa.html
          ! grep -E -q 'Georgia|Times New Roman|fonts\.googleapis\.com|fonts\.gstatic\.com' atlas-exit/parcours-usa.html
          grep -q 'atlas-ui.css?v=p5ds1-1' atlas-exit/parcours-usa.html
          grep -q 'font-src '\''self'\''' atlas-exit/parcours-usa.html
          test "$(grep -o 'data-card-step=' atlas-exit/parcours-usa.html | wc -l)" -eq 8
          test "$(grep -o 'data-step=' atlas-exit/parcours-usa.html | wc -l)" -eq 8

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Start exact-artifact server
        shell: bash
        run: |
          python -m http.server 4173 --directory atlas-exit >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/parcours-usa.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/http.log; exit 1

      - name: Browser + lifecycle gate
        shell: bash
        run: |
          cat > /tmp/qa.py <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          BASE='http://127.0.0.1:4173'
          URL=f'{BASE}/parcours-usa.html'
          GUIDE=f'{BASE}/offres.html?countries=USA'
          out=Path('qa-artifacts'); out.mkdir(exist_ok=True)
          report={'product_candidate':'609f103484a50f043e885960a1cbbe7c6f9fb9d9','html_blob':'1589d7d96826ef2e5bc54790a9614d9ad36765eb','css_blob':'a4af3e0236c6622a5488fa7836bca100922f382f','viewports':{}}

          init="""
          window.__atlasEvents=[];
          window.ATLAS_EVENT_COLLECTOR=(name,payload)=>{window.__atlasEvents.push({name,payload});return true;};
          """

          def assert_no_overflow(page, width):
              geom=page.evaluate("""() => ({doc:document.documentElement.scrollWidth,body:document.body.scrollWidth,vw:innerWidth})""")
              assert geom['doc'] <= width + 1 and geom['body'] <= width + 1, geom
              return geom

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for label,viewport in [('desktop',{'width':1440,'height':1000}),('mobile',{'width':390,'height':844})]:
                  page=browser.new_page(viewport=viewport,reduced_motion='no-preference')
                  page.add_init_script(init)
                  res=page.goto(URL,wait_until='domcontentloaded',timeout=30000)
                  assert res and res.ok
                  page.evaluate("localStorage.clear()")
                  page.reload(wait_until='domcontentloaded')
                  page.wait_for_timeout(800)

                  shell=page.evaluate("""() => {
                    const r=performance.getEntriesByType('resource').map(e=>e.name);
                    const b=getComputedStyle(document.body),h=getComputedStyle(document.querySelector('h1'));
                    return {bodyFont:b.fontFamily,h1Font:h.fontFamily,fontsStatus:document.fonts.status,manropeReady:document.fonts.check('16px Manrope'),fontResources:r.filter(x=>x.includes('Manrope-Variable.ttf')),forbidden:r.filter(x=>x.includes('fonts.googleapis.com')||x.includes('fonts.gstatic.com')),styleBlocks:document.querySelectorAll('style').length};
                  }""")
                  assert shell['fontsStatus']=='loaded' and shell['manropeReady'],shell
                  assert 'Manrope' in shell['bodyFont'] and 'Manrope' in shell['h1Font'],shell
                  assert 'Georgia' not in shell['h1Font'] and 'Times' not in shell['h1Font'],shell
                  assert shell['fontResources'] and not shell['forbidden'],shell
                  assert shell['styleBlocks']==0,shell
                  geom_fresh=assert_no_overflow(page,viewport['width'])
                  nav=page.locator('.atlas-shell__nav a'); assert nav.count()==4
                  nav_info=[]
                  for i in range(4):
                      link=nav.nth(i); box=link.bounding_box(); fs=link.evaluate('el=>parseFloat(getComputedStyle(el).fontSize)')
                      assert box and box['x']>=-1 and box['x']+box['width']<=viewport['width']+1,(label,box)
                      if label=='mobile':
                          assert fs>=13,(link.text_content(),fs)
                          assert box['height']>=42,(link.text_content(),box)
                      nav_info.append({'text':link.text_content().strip(),'fontSize':fs,'box':box})

                  assert page.locator('[data-step]').count()==8
                  assert page.locator('[data-card-step]').count()==8
                  assert page.locator('#doneCount').text_content().strip()=='0'
                  assert page.locator('#routeSummary').evaluate('el=>el.hidden')
                  page.screenshot(path=str(out/f'{label}-fresh.png'),full_page=True)

                  # Guide -> Roadmap handoff uses the actual acquisition CTA.
                  handoff=browser.new_page(viewport=viewport)
                  handoff.add_init_script(init)
                  handoff.goto(GUIDE,wait_until='domcontentloaded',timeout=30000)
                  cta=handoff.locator('a[data-atlas-event="free_funnel_cta"][data-atlas-target="roadmap"]').first
                  assert cta.count()==1 and cta.get_attribute('href')=='parcours-usa.html'
                  cta.click(); handoff.wait_for_url('**/parcours-usa.html'); handoff.wait_for_timeout(250)
                  assert handoff.locator('#routeForm').count()==1
                  assert_no_overflow(handoff,viewport['width']); handoff.close()

                  # Save a real route and verify persisted project + truthful QEP.
                  page.select_option('#profile','business')
                  page.select_option('#horizon','3-6')
                  page.fill('#city','New York')
                  page.select_option('#priority','business')
                  page.click('#routeForm button[type="submit"]')
                  page.wait_for_timeout(250)
                  assert not page.locator('#routeSummary').evaluate('el=>el.hidden')
                  route=page.evaluate("JSON.parse(localStorage.getItem('atlas_usa_route_v3'))")
                  assert route['answers']=={'profile':'business','horizon':'3-6','city':'New York','priority':'business'},route
                  events=page.evaluate('window.__atlasEvents')
                  qeps=[e for e in events if e['name']=='qualified_project']
                  assert len(qeps)==1,qeps
                  assert qeps[0]['payload']=={'origin':'FR','destination':'US','horizon_bucket':'3-6','route_version':'usa-v3','meaningful_action':'route_saved'},qeps
                  assert 'city' not in qeps[0]['payload'] and 'profile' not in qeps[0]['payload'] and 'priority' not in qeps[0]['payload']

                  for key in ['immigration','documents','france']:
                      page.locator(f'[data-step="{key}"]').check()
                  page.wait_for_timeout(180)
                  assert page.locator('#doneCount').text_content().strip()=='3'
                  assert_no_overflow(page,viewport['width'])
                  page.screenshot(path=str(out/f'{label}-partial.png'),full_page=True)

                  # Return state must restore 3/8 and expose resume to step 4.
                  page.reload(wait_until='domcontentloaded'); page.wait_for_timeout(500)
                  assert page.locator('#doneCount').text_content().strip()=='3'
                  assert not page.locator('#routeSummary').evaluate('el=>el.hidden')
                  resume=page.locator('#resumeRoute'); assert resume.is_visible()
                  assert resume.text_content().strip()=='Reprendre à l’étape 4 →'
                  resume.click(); page.wait_for_timeout(300)
                  focused=page.evaluate("document.activeElement && document.activeElement.getAttribute('data-step')")
                  assert focused=='landing',focused

                  # Complete all remaining steps; review state and QEP dedupe must hold.
                  for key in ['landing','entry','identity','settle','compliance']:
                      page.locator(f'[data-step="{key}"]').check()
                  page.wait_for_timeout(200)
                  assert page.locator('#doneCount').text_content().strip()=='8'
                  assert page.locator('#resumeRoute').text_content().strip()=='Revoir ma roadmap →'
                  marker=page.evaluate("JSON.parse(localStorage.getItem('atlas_usa_qep_v1'))")
                  assert marker and marker['status']=='sent',marker
                  qeps2=[e for e in page.evaluate('window.__atlasEvents') if e['name']=='qualified_project']
                  # Reload creates a new in-memory event collector, so dedupe truth is checked through marker + no new QEP after reload.
                  page.screenshot(path=str(out/f'{label}-complete.png'),full_page=True)
                  assert_no_overflow(page,viewport['width'])

                  page.reload(wait_until='domcontentloaded'); page.wait_for_timeout(350)
                  assert page.locator('#doneCount').text_content().strip()=='8'
                  assert [e for e in page.evaluate('window.__atlasEvents') if e['name']=='qualified_project']==[]

                  # Reset must clear route state and independent QEP marker.
                  page.click('#resetRoute'); page.wait_for_timeout(150)
                  cleared=page.evaluate("({route:localStorage.getItem('atlas_usa_route_v3'),qep:localStorage.getItem('atlas_usa_qep_v1')})")
                  assert cleared=={'route':None,'qep':None},cleared
                  assert page.locator('#doneCount').text_content().strip()=='0'
                  assert page.locator('#routeSummary').evaluate('el=>el.hidden')

                  reduced=browser.new_page(viewport=viewport,reduced_motion='reduce')
                  reduced.add_init_script(init); reduced.goto(URL,wait_until='domcontentloaded'); reduced.wait_for_timeout(250)
                  duration=reduced.locator('.primary-action').first.evaluate('el=>getComputedStyle(el).transitionDuration')
                  assert duration in ('0s','0.00001s','0.01ms','1e-05s'),duration
                  reduced.close()

                  report['viewports'][label]={'httpStatus':res.status,'shell':shell,'nav':nav_info,'freshOverflow':geom_fresh,'handoff':True,'fresh':'0/8','savedRoute':True,'qepPayload':qeps[0]['payload'],'partial':'3/8','resume':'step-4','complete':'8/8','reset':True,'reducedMotionTransitionDuration':duration}
                  page.close()
              browser.close()

          Path('qa-artifacts/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          python /tmp/qa.py

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-p5ds1-roadmap-qa
          path: qa-artifacts
          if-no-files-found: error
