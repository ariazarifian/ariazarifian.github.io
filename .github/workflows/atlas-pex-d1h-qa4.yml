name: Atlas PEX-D1H United Kingdom runtime QA4
on:
  push:
    branches: [ops/atlas-pex-d1h-uk-qa4-20260923]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Preserve QA harness and checkout exact Product candidate
        run: |
          cp scripts/pex_d1h_qa4.cjs /tmp/pex_d1h_qa4.cjs
          git checkout --detach f28862bf827bcd343fbdb65864458c8665c6bd40
      - name: Syntax and bounded Product scope
        run: |
          node --check atlas-exit/country-evidence-united-kingdom.js
          test "$(git diff --name-only 93c6cc1b1f54262ad23120d6067765dbaca3bbd8 f28862bf827bcd343fbdb65864458c8665c6bd40 -- atlas-exit | sort)" = "$(printf '%s\n' atlas-exit/country-evidence-united-kingdom.js atlas-exit/index.html | sort)"
          test "$(grep -o "state:'READY_FOR_PRODUCT'" atlas-exit/country-evidence-united-kingdom.js | wc -l | tr -d ' ')" = "8"
          grep -q 'universal183DayRule:false' atlas-exit/country-evidence-united-kingdom.js
          grep -q 'scotlandSeparateSchedule:true' atlas-exit/country-evidence-united-kingdom.js
          grep -q 'reconcileExplorerRuntime' atlas-exit/country-evidence-united-kingdom.js
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact Product candidate
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/atlas-exit/index.html >/dev/null && break; sleep 1; done
      - name: Real Chromium desktop/mobile + normalized evidence regressions
        run: |
          mkdir -p qa-artifacts
          NODE_PATH="$PWD/node_modules" node /tmp/pex_d1h_qa4.cjs
      - name: Shared readability and prior normalized countries unchanged
        run: |
          git diff --exit-code 93c6cc1b1f54262ad23120d6067765dbaca3bbd8 f28862bf827bcd343fbdb65864458c8665c6bd40 -- atlas-exit/country-evidence.js atlas-exit/atlas-country-evidence.css atlas-exit/script.js atlas-exit/conflict-tensions.js atlas-exit/conflict-tensions.css atlas-exit/country-evidence-australia.js atlas-exit/country-evidence-spain.js atlas-exit/country-evidence-japan.js atlas-exit/country-evidence-switzerland.js atlas-exit/country-evidence-singapore.js atlas-exit/country-evidence-canada.js
          grep -q '.atlas-evidence__row>p{display:none}' atlas-exit/atlas-country-evidence.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-pex-d1h-united-kingdom-runtime-qa4
          path: qa-artifacts
          if-no-files-found: warn
