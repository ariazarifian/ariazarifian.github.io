name: ATLAS P5Q1 RCURRENT Roadmap Live Smoke

on:
  push:
    branches:
      - ops/atlas-p5q1-rcurrent-roadmap-live-smoke-20260923

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Wait for exact public served bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          matched=0
          for i in $(seq 1 36); do
            q="$(date +%s)-$i"
            ok=1
            curl -fsSL -H 'Cache-Control: no-cache' --retry 2 "https://atlas-expat.fr/parcours-usa.html?qa=$q" -o /tmp/live-roadmap.html || ok=0
            curl -fsSL -H 'Cache-Control: no-cache' --retry 2 "https://atlas-expat.fr/atlas-ui-roadmap.css?qa=$q" -o /tmp/live-roadmap.css || ok=0
            curl -fsSL -H 'Cache-Control: no-cache' --retry 2 "https://atlas-expat.fr/parcours-usa.js?qa=$q" -o /tmp/live-roadmap.js || ok=0
            if [ "$ok" = 1 ] && cmp -s /tmp/live-roadmap.html atlas-exit/parcours-usa.html && cmp -s /tmp/live-roadmap.css atlas-exit/atlas-ui-roadmap.css && cmp -s /tmp/live-roadmap.js atlas-exit/parcours-usa.js; then
              matched=1
              break
            fi
            sleep 10
          done
          if [ "$matched" != 1 ]; then
            echo 'Exact public bytes did not converge in time.'
            sha256sum /tmp/live-roadmap.html /tmp/live-roadmap.css /tmp/live-roadmap.js atlas-exit/parcours-usa.html atlas-exit/atlas-ui-roadmap.css atlas-exit/parcours-usa.js || true
            exit 1
          fi
          {
            echo 'PUBLIC / LOCAL SHA256'
            sha256sum /tmp/live-roadmap.html /tmp/live-roadmap.css /tmp/live-roadmap.js atlas-exit/parcours-usa.html atlas-exit/atlas-ui-roadmap.css atlas-exit/parcours-usa.js
          } | tee qa-artifacts/served-byte-sha256.txt

      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Run public Chromium desktop/mobile smoke
        shell: bash
        run: |
          cat > /tmp/live_qa.py <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          ROOT='https://atlas-expat.fr'
          ROADMAP=f'{ROOT}/parcours-usa.html'
          CANDIDATE='cd7f2b86dffe4a8e51db0c47cb0ece55442e0c86'
          ROLLBACK='87ea8fa9a340703e79a0fcfc43b1a3dacd0d27d7'
          out=Path('qa-artifacts'); out.mkdir(exist_ok=True)
          report={'candidate':CANDIDATE,'rollback':ROLLBACK,'viewports':{},'adjacent':{}}
          init="""
          window.__atlasEvents=[];
          window.ATLAS_EVENT_COLLECTOR=(name,payload)=>{window.__atlasEvents.push({name,payload});return true;};
          """

          def overflow(page,w):
              g=page.evaluate("() => ({doc:document.documentElement.scrollWidth,body:document.body.scrollWidth,vw:innerWidth})")
              assert g['doc'] <= w+1 and g['body'] <= w+1, g
              return g

          def gate(browser,label,vp):
              page=browser.new_page(viewport=vp,reduced_motion='no-preference')
              page.add_init_script(init)
              page_errors=[]; same_origin_fail=[]
              page.on('pageerror',lambda e: page_errors.append(str(e)))
              page.on('requestfailed',lambda r: same_origin_fail.append({'url':r.url,'failure':r.failure}) if r.url.startswith(ROOT) else None)
              r=page.goto(ROADMAP,wait_until='domcontentloaded',timeout=45000)
              assert r and r.ok,(label,r.status if r else None)
              page.evaluate('document.fonts.ready'); page.wait_for_timeout(600)
              initial=overflow(page,vp['width'])
              assert page.locator('link[rel="canonical"]').get_attribute('href')=='https://atlas-expat.fr/parcours-usa.html'
              csp=page.locator('meta[http-equiv="Content-Security-Policy"]').get_attribute('content')
              assert csp and 'gateway.umami.is' in csp and "object-src 'none'" in csp,csp
              assert page.locator('.atlas-shell__nav a').count()==4
              assert page.locator('.rm-phase').count()==3
              assert page.locator('[data-card-step]').count()==8
              assert page.locator('[data-step]').count()==8
              assert page.locator('#doneCount').inner_text()=='0'
              assert page.locator('#routeSummary').is_hidden()
              assert page.locator('text=La plupart des non-citoyens doivent signaler à USCIS chaque changement d’adresse dans les 10 jours').count()==1
              assert page.locator('text=USPS ne met pas USCIS à jour').count()==1
              assert page.evaluate("document.fonts.check('16px Manrope')")
              page.screenshot(path=str(out/f'roadmap-live-{label}-fresh.png'),full_page=True)

              page.locator('body').press('Tab')
              active=page.evaluate("document.activeElement && document.activeElement.tagName")
              assert active in ('A','BUTTON','SELECT','INPUT'),active

              page.select_option('#profile','business')
              page.select_option('#horizon','3-6')
              page.fill('#city','Austin')
              page.select_option('#priority','tax')
              page.locator('#routeForm button[type="submit"]').click()
              page.wait_for_timeout(250)
              assert page.locator('#routeSummary').is_visible()
              names=[e['name'] for e in page.evaluate('window.__atlasEvents')]
              assert names==['route_started','qualified_project','roadmap_saved'],names
              marker=json.loads(page.evaluate("localStorage.getItem('atlas_usa_qep_v1')"))
              assert marker=={'route_version':'usa-v3','status':'sent'},marker
              checks=page.locator('[data-step]')
              for i in range(3): checks.nth(i).check()
              assert page.locator('#doneCount').inner_text()=='3'
              page.screenshot(path=str(out/f'roadmap-live-{label}-active.png'),full_page=True)
              active_overflow=overflow(page,vp['width'])

              page.reload(wait_until='domcontentloaded'); page.wait_for_timeout(300)
              assert page.locator('#doneCount').inner_text()=='3'
              assert page.locator('#routeSummary').is_visible()
              assert page.locator('#resumeRoute').is_visible()
              assert page.locator('#resumeRoute').inner_text()=='Reprendre à l’étape 4 →'
              assert [e['name'] for e in page.evaluate('window.__atlasEvents')]==['roadmap_returned']
              page.locator('#resumeRoute').click(); page.wait_for_timeout(100)
              assert page.evaluate("document.activeElement && document.activeElement.getAttribute('data-step')")=='landing'
              checks=page.locator('[data-step]')
              for i in range(3,8): checks.nth(i).check()
              assert page.locator('#doneCount').inner_text()=='8'
              assert [e['name'] for e in page.evaluate('window.__atlasEvents')]==['roadmap_returned','route_completed']
              page.locator('#resetRoute').click()
              assert page.locator('#doneCount').inner_text()=='0'
              assert page.locator('#routeSummary').is_hidden()
              assert page.evaluate("localStorage.getItem('atlas_usa_route_v3')") is None
              assert page.evaluate("localStorage.getItem('atlas_usa_qep_v1')") is None
              final_overflow=overflow(page,vp['width'])
              assert not page_errors,page_errors
              assert not same_origin_fail,same_origin_fail

              reduced=browser.new_page(viewport=vp,reduced_motion='reduce')
              rr=reduced.goto(ROADMAP,wait_until='domcontentloaded',timeout=45000); assert rr and rr.ok
              reduced.wait_for_timeout(100)
              duration=reduced.locator('.step').first.evaluate('el=>getComputedStyle(el).transitionDuration')
              assert duration in ('0s','0.00001s','0.01ms','1e-05s'),duration
              reduced.close()
              data={'status':r.status,'initialOverflow':initial,'activeOverflow':active_overflow,'finalOverflow':final_overflow,'phaseCount':3,'stepCount':8,'lifecyclePass':True,'reducedMotion':duration,'pageErrors':page_errors,'sameOriginFailures':same_origin_fail}
              page.close(); return data

          def adjacent(browser,path,label,w=1440,h=1000):
              p=browser.new_page(viewport={'width':w,'height':h})
              errs=[]; fails=[]
              p.on('pageerror',lambda e: errs.append(str(e)))
              p.on('requestfailed',lambda r: fails.append(r.url) if r.url.startswith(ROOT) else None)
              r=p.goto(f'{ROOT}/{path}',wait_until='domcontentloaded',timeout=45000)
              assert r and r.ok,(label,r.status if r else None)
              p.wait_for_timeout(300)
              g=overflow(p,w)
              assert not errs,(label,errs)
              assert not fails,(label,fails)
              data={'status':r.status,'overflow':g,'title':p.title()}
              p.close(); return data

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for label,vp in [('desktop',{'width':1440,'height':1000}),('mobile',{'width':390,'height':844})]:
                  report['viewports'][label]=gate(browser,label,vp)
              report['adjacent']['guide']=adjacent(browser,'offres.html','guide')
              report['adjacent']['explorer']=adjacent(browser,'index.html','explorer')
              report['adjacent']['accompagnement']=adjacent(browser,'accompagnement.html','accompagnement')
              browser.close()
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          python /tmp/live_qa.py

      - name: Upload public live-smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-p5q1-rcurrent-roadmap-live-smoke
          path: qa-artifacts
          if-no-files-found: error
