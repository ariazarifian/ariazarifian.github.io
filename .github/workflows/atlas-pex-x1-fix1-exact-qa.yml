name: Atlas PEX-X1 FIX1 exact browser gate
on:
  push:
    branches: [ops/atlas-pex-x1-fix1-qa-20260922]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact Product candidate and bounded scope
        run: |
          git checkout --detach 7a58d04b240ab33cf75ffb0d1c823913833e373e
          test "$(git rev-parse HEAD)" = "7a58d04b240ab33cf75ffb0d1c823913833e373e"
          expected="$(printf '%s\n' atlas-exit/conflict-tensions.css atlas-exit/conflict-tensions.js atlas-exit/index.html | sort)"
          actual="$(git diff --name-only e87f4882a010d51b7d7cbd83fb11a7c75e3a16bd 7a58d04b240ab33cf75ffb0d1c823913833e373e | sort)"
          test "$actual" = "$expected"
          test "$(git diff --name-only d67faffbef79bffc284aa94337f6b82bf078ce99 7a58d04b240ab33cf75ffb0d1c823913833e373e)" = "atlas-exit/conflict-tensions.js"
          node --check atlas-exit/conflict-tensions.js
          git diff --check e87f4882a010d51b7d7cbd83fb11a7c75e3a16bd 7a58d04b240ab33cf75ffb0d1c823913833e373e
          grep -F "const governance=[...body.children]" atlas-exit/conflict-tensions.js
          grep -F "const source=[...body.children]" atlas-exit/conflict-tensions.js
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert/strict');
          global.window={};global.document={readyState:'loading',addEventListener(){}};
          vm.runInThisContext(fs.readFileSync('atlas-exit/conflict-tensions.js','utf8'));
          const d=window.ATLAS_CONFLICT_TENSIONS;
          const expected={USA:'Faible',THA:'Modéré',AUS:'Modéré',ESP:'Modéré',JPN:'Modéré',CHE:'Faible',SGP:'Modéré',CAN:'Modéré'};
          assert.deepEqual(Object.fromEntries(Object.entries(d).map(([k,v])=>[k,v.category])),expected);
          assert.equal(d.THA.multi_source_required,true);assert.equal(d.JPN.multi_source_required,true);
          assert.equal(d.THA.sources.length,2);assert.equal(d.JPN.sources.length,4);
          assert.match(d.THA.geography,/Pattani/);assert.match(d.THA.geography,/20 km/);
          assert.match(d.JPN.context,/20 septembre 2026/);assert.match(d.JPN.context,/440 km/);
          assert.match(d.JPN.caveat,/hors ZEE/);assert.match(d.JPN.caveat,/aucun dommage/);
          assert.match(d.JPN.sources[0].url,/2026\/09\/20e\.html/);assert.match(d.JPN.sources[1].url,/2026\/0920a_r\.html/);
          JS
      - name: Install Chromium outside Product worktree
        run: |
          mkdir -p /tmp/atlas-x1-qa
          cd /tmp/atlas-x1-qa
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Serve exact Product candidate
        run: |
          git checkout --detach 7a58d04b240ab33cf75ffb0d1c823913833e373e
          python3 -m http.server 8000 >/tmp/atlas-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/atlas-exit/index.html >/dev/null && break; sleep 1; done
      - name: Chromium desktop and mobile
        run: |
          mkdir -p qa-artifacts
          cat >/tmp/x1-fix1.cjs <<'JS'
          const {chromium}=require('/tmp/atlas-x1-qa/node_modules/playwright');
          const fs=require('fs'),assert=require('node:assert/strict');
          const url='http://127.0.0.1:8000/atlas-exit/index.html';
          const expected={USA:'Faible',THA:'Modéré',AUS:'Modéré',ESP:'Modéré',JPN:'Modéré',CHE:'Faible',SGP:'Modéré',CAN:'Modéré'};
          const report={productHead:'7a58d04b240ab33cf75ffb0d1c823913833e373e',baseHead:'e87f4882a010d51b7d7cbd83fb11a7c75e3a16bd',viewports:[]};
          async function openCountry(page,id,name){
            await page.locator('#countrySearch').fill(name);await page.waitForTimeout(160);
            const row=page.locator(`[data-country="${id}"]`);assert.equal(await row.count(),1,id);
            await row.click({force:true});
            await page.waitForFunction(iso=>window.AtlasExplorer?.state?.selected===iso,id,{timeout:5000});
            const panel=page.locator(`#inspector [data-conflict-panel][data-country="${id}"]`);
            await panel.waitFor({state:'visible',timeout:8000});
            assert.equal(await panel.evaluate(el=>el.parentElement?.classList.contains('inspector-body')),true,'panel must be direct inspector-body child');
            assert.equal((await panel.locator('.conflict-risk').textContent()).trim(),expected[id],id);
            assert.match(await panel.innerText(),/22\.09\.2026/);
            return panel;
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const cfg of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]){
              const context=await browser.newContext({viewport:{width:cfg.width,height:cfg.height}}),page=await context.newPage(),errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error'&&!/umami|ERR_FAILED|Failed to load resource/i.test(m.text()))errors.push('console: '+m.text())});
              await page.goto(url,{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.AtlasExplorer?.ready?.()&&window.ATLAS_CONFLICT_TENSIONS?.JPN?.sources?.length===4,null,{timeout:15000});
              assert.equal(await page.locator('[data-layer="explore"]').count(),0);
              assert.equal(await page.locator('[data-layer]').count(),3);
              assert.equal(await page.evaluate(()=>document.fonts.check('12px Manrope')),true);
              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true,'document overflow');
              if(cfg.name==='mobile'){
                await page.locator('#mobileFilters').click();
                assert.equal(await page.locator('#mobileFilters').getAttribute('aria-expanded'),'true');
              }
              await page.locator('[data-layer="conflict"]').click();
              await page.waitForFunction(()=>document.body.classList.contains('conflict-layer'));
              await page.waitForFunction(()=>{const f=id=>getComputedStyle(document.querySelector(`#countries [data-id="${id}"]`)).fill;return f('USA')==='rgb(95, 141, 118)'&&f('CHE')==='rgb(95, 141, 118)'&&f('THA')==='rgb(168, 132, 85)'});
              assert.equal((await page.locator('#mapLabel').textContent()).trim(),'CONFLIT & TENSIONS · ÉTAT AU 22.09.2026');
              let p=await openCountry(page,'THA','Thaïlande');
              assert.equal(await p.locator('a.conflict-source').count(),2);let tt=await p.innerText();assert.match(tt,/Pattani/);assert.match(tt,/20 km/);assert.match(tt,/Bangkok/);assert.match(tt,/Phuket/);
              await page.locator('#inspector [data-dismiss]').click();
              p=await openCountry(page,'JPN','Japon');
              assert.equal(await p.locator('a.conflict-source').count(),4);let jt=await p.innerText();assert.match(jt,/20 septembre 2026/);assert.match(jt,/440 km/);assert.match(jt,/hors ZEE/);assert.match(jt,/aucun dommage/);
              await page.locator('#inspector [data-dismiss]').click();
              p=await openCountry(page,'CHE','Suisse');await page.locator('#inspector [data-save="CHE"]').click();await page.locator('#inspector [data-dismiss]').click();
              p=await openCountry(page,'THA','Thaïlande');await page.locator('#inspector [data-save="THA"]').click();await page.locator('#inspector [data-dismiss]').click();
              assert.equal((await page.locator('#savedCount').textContent()).trim(),'2');
              await page.evaluate(()=>document.querySelector('#openCompare')?.click());
              await page.locator('#compareDialog').waitFor({state:'visible'});await page.waitForSelector('#compareTable [data-conflict-row]');
              const cmp=await page.locator('#compareTable [data-conflict-row]').innerText();assert.match(cmp,/Modéré/);assert.match(cmp,/Faible/);assert.match(cmp,/Pattani/);
              await page.locator('#compareDialog [data-close]').click();
              assert.equal(await page.locator('#inspector').evaluate(el=>el.scrollWidth<=el.clientWidth+1),true,'inspector overflow');
              await page.locator('[data-layer="stability"]').click();assert.equal(await page.evaluate(()=>document.body.classList.contains('conflict-layer')),false);assert.match(await page.locator('#mapLabel').textContent(),/BANQUE MONDIALE/);
              await page.locator('[data-layer="conflict"]').click();await page.waitForFunction(()=>document.body.classList.contains('conflict-layer'));
              await page.screenshot({path:`qa-artifacts/x1-fix1-${cfg.name}.png`,fullPage:false});
              assert.deepEqual(errors,[]);
              report.viewports.push({...cfg,errors,documentOverflow:false,inspectorTopLevel:true});
              await context.close();
            }
            await browser.close();fs.writeFileSync('qa-artifacts/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/x1-fix1.cjs
      - name: Prove Product immutability
        run: |
          test "$(git rev-parse HEAD)" = "7a58d04b240ab33cf75ffb0d1c823913833e373e"
          git diff --quiet
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-pex-x1-fix1-exact-qa
          path: qa-artifacts
          if-no-files-found: warn
