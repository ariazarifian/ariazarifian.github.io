name: P3C promote reviewed frontend

on:
  push:
    branches:
      - ops/atlas-executor-funnel-20260919
    paths:
      - .atlas-p3c-frontend-trigger

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: ops/atlas-exit-20260914
          fetch-depth: 0

      - name: Promote only Chief-reviewed frontend files
        run: |
          set -euo pipefail
          candidate=abcbabba5c008a4820ec1d007b379a69e9b7086a
          base="https://raw.githubusercontent.com/ariazarifian/ariazarifian.github.io/$candidate"
          files=(
            atlas-exit/offres.html
            atlas-exit/atlas-events.js
            atlas-exit/parcours-usa.html
            atlas-exit/parcours-usa.js
            atlas-exit/s-expatrier-etats-unis.html
            atlas-exit/visa-e2-etats-unis-francais.html
            atlas-exit/immigration-usa.html
            atlas-exit/accompagnement.html
          )
          for f in "${files[@]}"; do
            mkdir -p "$(dirname "$f")"
            curl --retry 3 --retry-delay 1 -fsSL "$base/$f" -o "$f"
          done

          node --check atlas-exit/atlas-events.js
          node --check atlas-exit/parcours-usa.js

          test "$(git hash-object atlas-exit/offres.html)" = da209bc39deef16227b0e981ea5ca6109e6f7f7a
          test "$(git hash-object atlas-exit/atlas-events.js)" = 6e0c520c330faa278bcc76828b2918ec02f6fbcf
          test "$(git hash-object atlas-exit/parcours-usa.html)" = 864062296c01843041ea426772833005bb28ccc2
          test "$(git hash-object atlas-exit/parcours-usa.js)" = ab2b2957ead438ec44141fab2e721adc16f08878
          test "$(git hash-object atlas-exit/s-expatrier-etats-unis.html)" = 0a746572e01078aa74b11ad41d83b9e18a7aa0ab
          test "$(git hash-object atlas-exit/visa-e2-etats-unis-francais.html)" = ffa9e7c7d0cecb4d2d03ad6428e4891dc09d1d1c
          test "$(git hash-object atlas-exit/immigration-usa.html)" = c424cfaaa3ba8a71d05b80eb089b2329fa1d52fd
          test "$(git hash-object atlas-exit/accompagnement.html)" = 7eb7fc66d753219d9cf0235dda77039bb21bec3e
          echo 'exact reviewed frontend blobs PASS'

          git add "${files[@]}"
          staged=$(git diff --cached --name-only)
          echo "$staged"
          expected=$(printf '%s\n' "${files[@]}" | sort)
          actual=$(printf '%s\n' "$staged" | sort)
          test "$actual" = "$expected"

          git config user.name 'ATLAS Product Executor'
          git config user.email '71772355+ariazarifian@users.noreply.github.com'
          git commit -m 'Release truthful free V15 USA funnel'
          git push origin HEAD:ops/atlas-exit-20260914
