name: Atlas PEX-D1D Japan evidence QA
on:
  push:
    branches: [ops/atlas-pex-d1d-japan-20260922]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contract fidelity and bounded scope
        env:
          PRODUCT_HEAD: edcb964f27d7c05588fff6581684306946a25675
          BASE_HEAD: 7c20e50a815b89954d9ef080edc5861775055754
        run: |
          git checkout --detach "$PRODUCT_HEAD"
          node --check atlas-exit/country-evidence-japan.js
          node --check atlas-exit/country-evidence.js
          node --check atlas-exit/fiscal-finalize.js
          node - <<'JS'
          const assert=require('node:assert/strict');
          const core=require('./atlas-exit/country-evidence.js');
          require('./atlas-exit/country-evidence-japan.js');
          const e=globalThis.ATLAS_COUNTRY_EVIDENCE;
          const j=e.countries.JPN;
          assert.ok(j);
          assert.equal(j.integrationState,'published');
          assert.equal(e.validateCountry(j).ok,true);
          assert.deepEqual(Object.keys(j.fields),e.requiredFields);
          const states=Object.values(j.fields).map(x=>x.state);
          assert.equal(states.filter(x=>x==='READY_WITH_CAVEAT').length,6);
          assert.equal(states.filter(x=>x==='READY_FOR_PRODUCT').length,2);
          const counts={tax_residency:1,pit:2,cit_business:2,consumption_tax:1,cost_context:1,residence_visa:3,healthcare:2,safety_context:1};
          for(const [k,n] of Object.entries(counts)) assert.equal(e.sourcesFor(j.fields[k]).length,n,k);
          assert.equal(Object.values(counts).reduce((a,b)=>a+b,0),13);
          assert.deepEqual(e.sourcesFor(j.fields.pit).map(s=>s.locator),['https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2260.htm','https://www.nta.go.jp/taxes/shiraberu/taxanswer/osirase/9000.htm']);
          assert.deepEqual(e.sourcesFor(j.fields.cit_business).map(s=>s.locator),['https://www.nta.go.jp/taxes/shiraberu/taxanswer/hojin/5759.htm','https://www.nta.go.jp/taxes/shiraberu/taxanswer/osirase/9000.htm']);
          assert.deepEqual(e.sourcesFor(j.fields.residence_visa).map(s=>s.locator),['https://www.mofa.go.jp/j_info/visit/visa/short/novisa.html','https://www.mofa.go.jp/j_info/visit/visa/','https://www.moj.go.jp/isa/applications/status/']);
          assert.deepEqual(e.sourcesFor(j.fields.healthcare).map(s=>s.locator),['https://www.mhlw.go.jp/stf/newpage_21539.html','https://www.mhlw.go.jp/stf/newpage_21895.html']);
          assert.equal(j.fields.tax_residency.structure.day183ShortcutForbidden,true);
          assert.equal(j.fields.pit.structure.allInScalarForbidden,true);
          assert.equal(j.fields.cit_business.structure.allInScalarForbidden,true);
          assert.deepEqual(j.fields.pit.structure.mandatoryRecheckDates,['2026-12-02','2027-01-01']);
          assert.deepEqual(j.fields.consumption_tax.structure.mandatoryRecheckDates,['2027-03-02','2027-04-01']);
          assert.equal(j.fields.pit.structure.knownEffectiveChange.date,'2027-01-01');
          assert.equal(j.fields.pit.structure.knownEffectiveChange.reconstructionSpecialIncomeTaxRateOnBaseIncomeTax,1.1);
          assert.equal(j.fields.pit.structure.knownEffectiveChange.defenseSpecialIncomeTaxRateOnBaseIncomeTax,1);
          assert.equal(j.fields.consumption_tax.structure.knownEffectiveChange.date,'2027-04-01');
          assert.equal(j.fields.cost_context.structure.monthlyConsumptionExpenditureJPY,314001);
          assert.equal(j.fields.cost_context.structure.workersHouseholdsMonthlyConsumptionExpenditureJPY,346297);
          assert.equal(j.fields.residence_visa.structure.standardLandingPeriodDays,90);
          assert.equal(j.fields.residence_visa.structure.shortTermRemunerativeActivityPermitted,false);
          assert.equal(j.fields.healthcare.structure.blanketForeignerEqualsNHI,false);
          assert.equal(j.fields.safety_context.structure.scalarScoreForbidden,true);
          console.log('PEX-D1D contract PASS');
          JS
          test "$(git diff --name-only "$BASE_HEAD" "$PRODUCT_HEAD" -- atlas-exit | sort)" = "$(printf '%s\n' atlas-exit/country-evidence-japan.js atlas-exit/fiscal-finalize.js | sort)"
          git diff --exit-code "$BASE_HEAD" "$PRODUCT_HEAD" -- atlas-exit/country-evidence.js atlas-exit/country-evidence-australia.js atlas-exit/country-evidence-spain.js atlas-exit/atlas-country-evidence.css atlas-exit/index.html atlas-exit/script.js atlas-exit/atlas-events.js atlas-exit/catalog.js atlas-exit/commerce-data.js atlas-exit/tax-additions.js atlas-exit/corporate-world.js atlas-exit/consumption-world.js atlas-exit/sitemap.xml atlas-exit/robots.txt
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact Product candidate
        run: |
          git checkout --detach edcb964f27d7c05588fff6581684306946a25675
          python3 -m http.server 8000 >/tmp/pex-d1d-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/atlas-exit/index.html >/dev/null && break; sleep 1; done
      - name: Real Chrome desktop and mobile
        run: |
          mkdir -p qa-artifacts
          cat >/tmp/qa.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const url='http://127.0.0.1:8000/atlas-exit/index.html';
          const report={productHead:'edcb964f27d7c05588fff6581684306946a25675',baseHead:'7c20e50a815b89954d9ef080edc5861775055754',viewports:[],errors:[]};
          async function openCountry(page,name,id,panelSelector){
            const dismiss=page.locator('[data-dismiss]');
            if(await dismiss.count()) await dismiss.click().catch(()=>{});
            await page.locator('#countrySearch').fill(name);
            await page.waitForTimeout(120);
            const row=page.locator(`[data-country="${id}"]`).first();
            await row.waitFor({state:'attached'});
            // Programmatic click is intentional QA plumbing: mobile Explorer rows can remain
            // outside the scrollable map-list viewport after inspector interactions.
            await row.evaluate(el=>el.click());
            await page.waitForSelector(panelSelector);
            return page.locator(panelSelector);
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const cfg of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]){
              const context=await browser.newContext({viewport:{width:cfg.width,height:cfg.height}});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error'&&!/umami|ERR_FAILED|Failed to load resource/i.test(m.text()))errors.push('console: '+m.text())});
              await page.goto(url,{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.querySelector('#resultCount')?.textContent&&!/Chargement/.test(document.querySelector('#resultCount').textContent),null,{timeout:15000});
              await page.waitForFunction(()=>window.ATLAS_COUNTRY_EVIDENCE?.countries?.JPN?.integrationState==='published',null,{timeout:10000});
              assert.equal(await page.evaluate(()=>document.fonts.check('12px Manrope')),true);
              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true);
              const z0=await page.locator('#zoomValue').textContent();
              await page.locator('#zoomIn').click(); await page.waitForTimeout(100);
              const z1=await page.locator('#zoomValue').textContent(); assert.notEqual(z0,z1);
              if(cfg.name==='mobile'){await page.locator('#mobileFilters').click();assert.equal(await page.locator('#mobileFilters').getAttribute('aria-expanded'),'true');}
              const runtime=await page.evaluate(()=>{const c=window.AtlasExplorer.getCountries().find(x=>x.id==='JPN');const j=window.ATLAS_COUNTRY_EVIDENCE.countries.JPN;return {tax:c.tax,scope:c.scope,year:c.taxYear,taxStore:window.ATLAS_TAX.JPN.tax,bootstrap:window.ATLAS_FISCAL_FINALIZE.countryEvidenceBootstrap,pitChange:j.fields.pit.structure.knownEffectiveChange,vatChange:j.fields.consumption_tax.structure.knownEffectiveChange,pitRechecks:j.fields.pit.structure.mandatoryRecheckDates,vatRechecks:j.fields.consumption_tax.structure.mandatoryRecheckDates};});
              assert.equal(runtime.tax,45); assert.equal(runtime.taxStore,45); assert.equal(runtime.year,'NTA · état du droit 01.04.2026'); assert.match(runtime.scope,/reconstruction|impôt local/i); assert.equal(runtime.bootstrap,'pex-d1d-1');
              assert.equal(runtime.pitChange.date,'2027-01-01'); assert.equal(runtime.vatChange.date,'2027-04-01');
              assert.deepEqual(runtime.pitRechecks,['2026-12-02','2027-01-01']); assert.deepEqual(runtime.vatRechecks,['2027-03-02','2027-04-01']);
              await page.locator('#countrySearch').fill('Japon'); await page.waitForTimeout(100);
              assert.equal(await page.locator('[data-country="JPN"]').count(),1);
              await page.locator('#taxRange').evaluate(el=>{el.value='45';el.dispatchEvent(new Event('input',{bubbles:true}));}); await page.waitForTimeout(80);
              assert.equal(await page.locator('[data-country="JPN"]').count(),1);
              await page.locator('#taxRange').evaluate(el=>{el.value='40';el.dispatchEvent(new Event('input',{bubbles:true}));}); await page.waitForTimeout(80);
              assert.equal(await page.locator('[data-country="JPN"]').count(),0);
              await page.locator('#taxRange').evaluate(el=>{el.value='60';el.dispatchEvent(new Event('input',{bubbles:true}));}); await page.waitForTimeout(80);
              const panel=await openCountry(page,'Japon','JPN','[data-atlas-japan-evidence][data-country="JPN"]');
              assert.equal(await panel.locator('[data-evidence-field]').count(),8);
              assert.equal(await panel.locator('a.detail-source').count(),13);
              assert.equal(await panel.locator('[data-source-count]').count(),4);
              const multiCounts=await panel.locator('[data-source-count]').evaluateAll(rows=>rows.map(x=>Number(x.getAttribute('data-source-count'))));
              assert.deepEqual(multiCounts,[2,2,3,2]);
              const states=await panel.locator('[data-evidence-state]').evaluateAll(rows=>rows.map(x=>x.getAttribute('data-evidence-state')));
              assert.equal(states.filter(x=>x==='READY_WITH_CAVEAT').length,6);
              assert.equal(states.filter(x=>x==='READY_FOR_PRODUCT').length,2);
              const text=await panel.innerText();
              assert.match(text,/5–45 % national/); assert.match(text,/2,1 %/); assert.match(text,/impôt local/i); assert.match(text,/23,2 %/); assert.match(text,/10 % standard/); assert.match(text,/8 % réduit/); assert.match(text,/314 001/); assert.match(text,/90 jours/); assert.match(text,/National Health Insurance|NHI/); assert.doesNotMatch(text,/Non documenté|À documenter/i);
              assert.equal(await page.locator('.tax-stack').evaluate(el=>el.hidden),true);
              assert.equal(await page.locator('.source-disclosure').evaluate(el=>el.hidden),true);
              const box=await page.locator('#inspector').boundingBox(); assert.ok(box&&box.x>=-1&&box.y>=-1&&box.x+box.width<=cfg.width+1&&box.y+box.height<=cfg.height+1);
              await page.locator('[data-save="JPN"]').click(); assert.equal(await page.locator('#savedCount').textContent(),'1');
              let p=await openCountry(page,'Espagne','ESP','[data-atlas-spain-evidence][data-country="ESP"]'); assert.equal(await p.locator('[data-evidence-field]').count(),8); assert.equal(await p.locator('a.detail-source').count(),9); await page.locator('[data-save="ESP"]').click();
              p=await openCountry(page,'Australie','AUS','[data-atlas-australia-evidence][data-country="AUS"]'); assert.equal(await p.locator('[data-evidence-field]').count(),8); assert.equal(await p.locator('a.detail-source').count(),11);
              p=await openCountry(page,'Thaïlande','THA','[data-atlas-evidence-panel][data-country="THA"]'); assert.equal(await p.locator('[data-evidence-field]').count(),8); assert.equal(await p.locator('a.detail-source').count(),8);
              await page.locator('#openCompare').click(); await page.locator('#compareDialog').waitFor({state:'visible'}); await page.waitForTimeout(100);
              const compare=await page.locator('#compareTable').innerText();
              assert.match(compare,/Japon/); assert.match(compare,/5–45 % national/); assert.match(compare,/23,2 % national ordinaire/); assert.match(compare,/10 % standard · 8 % réduit/); assert.match(compare,/2,1 %/); assert.match(compare,/impôt local/i);
              assert.ok(await page.locator('#compareTable [data-atlas-normalized="JPN"]').count()>=5);
              await page.locator('#compareDialog [data-close]').click();
              await page.screenshot({path:`qa-artifacts/pex-d1d-${cfg.name}.png`,fullPage:false});
              const full=await page.screenshot({path:`qa-artifacts/pex-d1d-${cfg.name}-full.png`,fullPage:true});
              report.viewports.push({name:cfg.name,width:cfg.width,height:cfg.height,zoom:[z0,z1],runtime,fields:8,sourceLinks:13,multiSourceGroups:multiCounts,inspector:box,fullScreenshotBytes:full.length});
              report.errors.push(...errors.map(x=>`${cfg.name}: ${x}`)); assert.deepEqual(errors,[]);
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('qa-artifacts/pex-d1d-report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/qa.cjs
      - name: Reduced motion and immutable shell
        run: |
          grep -q '@media(prefers-reduced-motion:reduce)' atlas-exit/atlas-country-evidence.css
          git diff --exit-code 7c20e50a815b89954d9ef080edc5861775055754 edcb964f27d7c05588fff6581684306946a25675 -- atlas-exit/country-evidence.js atlas-exit/country-evidence-australia.js atlas-exit/country-evidence-spain.js atlas-exit/atlas-country-evidence.css atlas-exit/index.html atlas-exit/script.js atlas-exit/atlas-events.js atlas-exit/sitemap.xml atlas-exit/robots.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-pex-d1d-japan-evidence-qa
          path: qa-artifacts
          if-no-files-found: error
