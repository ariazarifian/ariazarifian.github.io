name: Atlas P5DS4 Explorer drawer final-position QA

on:
  push:
    branches:
      - ops/atlas-p5ds4-closure-20260921
    paths:
      - '.github/workflows/atlas-p5ds4-drawer-final-position.yml'

permissions:
  contents: read

jobs:
  drawer-final-position:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prove public Explorer bytes are the production bytes under test
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html style.css atlas-ui.css atlas-ui-explorer.css; do
            curl --fail --silent --show-error --location --retry 3 -H 'Cache-Control: no-cache' \
              "https://atlas-expat.fr/${f}?p5ds4drawer=${GITHUB_RUN_ID}" -o "/tmp/${f}"
            cmp "atlas-exit/${f}" "/tmp/${f}"
          done

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p5ds4-drawer && cd /tmp/p5ds4-drawer
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Verify drawer geometry after its CSS transition completes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/p5ds4-drawer/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, serviceWorkers: 'block' });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', e => errors.push(`pageerror:${e.message}`));
          page.on('console', m => { if (m.type() === 'error') errors.push(`console:${m.text()}`); });
          await page.goto('https://atlas-expat.fr/index.html', { waitUntil: 'load', timeout: 60000 });
          await page.waitForFunction(() => document.querySelectorAll('#countries path').length >= 200, null, { timeout: 30000 });
          const toggle = page.locator('#mobileFilters');
          await toggle.click();
          await page.locator('#sidebar').evaluate(el => new Promise(resolve => {
            const done = () => resolve();
            el.addEventListener('transitionend', done, { once: true });
            setTimeout(done, 500);
          }));
          const geometry = await page.locator('#sidebar').evaluate(el => {
            const r = el.getBoundingClientRect();
            const s = getComputedStyle(el);
            return {
              x: r.x, left: r.left, right: r.right, width: r.width,
              viewportWidth: innerWidth,
              transform: s.transform,
              transitionDuration: s.transitionDuration,
              maxWidth: s.maxWidth,
              position: s.position,
              open: el.classList.contains('open')
            };
          });
          console.log('FINAL_DRAWER_GEOMETRY=' + JSON.stringify(geometry));
          console.log('RUNTIME_ERRORS=' + JSON.stringify(errors));
          if (!geometry.open) throw new Error('drawer is not open');
          if (Math.abs(geometry.x) > 0.75) throw new Error(`drawer final x is ${geometry.x}px instead of 0px`);
          if (geometry.right > geometry.viewportWidth + 0.75) throw new Error(`drawer right edge ${geometry.right}px exceeds viewport ${geometry.viewportWidth}px`);
          if (geometry.width > geometry.viewportWidth - 59) throw new Error(`drawer width ${geometry.width}px violates intended >=60px map reveal`);
          if (geometry.transform !== 'matrix(1, 0, 0, 1, 0, 0)' && geometry.transform !== 'none') throw new Error(`drawer final transform is ${geometry.transform}`);
          if (errors.length) throw new Error(`runtime errors: ${errors.join(' | ')}`);
          await page.screenshot({ path: '/tmp/p5ds4-drawer/final-drawer.png', fullPage: true });
          await browser.close();
          EOF
          cd /tmp/p5ds4-drawer && node check.mjs

      - name: Upload final-position evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-p5ds4-drawer-final-position
          path: /tmp/p5ds4-drawer/final-drawer.png
          if-no-files-found: warn
          retention-days: 14
