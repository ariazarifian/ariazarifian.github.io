name: ATLAS PEX-CF2 B2 public live smoke
on:
  push:
    branches: [ops/atlas-pex-cf2-b2-live-smoke-20260924]
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove QA-only branch preserves released Product bytes
        shell: bash
        run: |
          set -euo pipefail
          C=e6ff4653042f64f1d1bf3c93d96fd0a579f98b3f
          test "$(git merge-base "$C" HEAD)" = "$C"
          git diff --exit-code "$C" HEAD -- atlas-exit scripts/atlas_country_factory_b2_browser_qa.cjs
      - name: Verify public served bytes equal released Product
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts /tmp/live-atlas
          q="$(date +%s)"
          files=(
            index.html
            country-factory-dex-cf2-b2-meta.js
            country-factory-dex-cf2-b2-bel.js
            country-factory-dex-cf2-b2-cze.js
            country-factory-dex-cf2-b2-grc.js
            country-factory-dex-cf2-b2-lux.js
            country-factory-dex-cf2-b2-pol.js
            country-factory-runtime.js
          )
          for i in {1..30}; do
            ok=1
            for f in "${files[@]}"; do
              curl -fsSL -H 'Cache-Control: no-cache' "https://atlas-expat.fr/$f?qa=$q-$i" -o "/tmp/live-atlas/$f" || ok=0
              if [ "$ok" -eq 1 ]; then cmp "/tmp/live-atlas/$f" "atlas-exit/$f" || ok=0; fi
              [ "$ok" -eq 1 ] || break
            done
            [ "$ok" -eq 1 ] && break
            test "$i" -lt 30 || exit 1
            sleep 3
          done
          for f in "${files[@]}"; do sha256sum "/tmp/live-atlas/$f" "atlas-exit/$f"; done | tee qa-artifacts/served-byte-sha256.txt
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare exact live browser QA
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/atlas_country_factory_b2_browser_qa.cjs /tmp/live-qa.cjs
          python3 - <<'PY'
          p='/tmp/live-qa.cjs'
          s=open(p,encoding='utf-8').read()
          s=s.replace("const PRODUCT=process.env.GITHUB_SHA||process.env.ATLAS_PRODUCT_SHA||'UNKNOWN';","const PRODUCT=process.env.ATLAS_PRODUCT_SHA||process.env.GITHUB_SHA||'UNKNOWN';")
          s=s.replace("const BASE='http://127.0.0.1:8000/atlas-exit/index.html';","const BASE='https://atlas-expat.fr/index.html';")
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Public Chromium desktop and mobile live smoke
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          ATLAS_PRODUCT_SHA: e6ff4653042f64f1d1bf3c93d96fd0a579f98b3f
        run: timeout 300s node /tmp/live-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-pex-cf2-b2-public-live-smoke
          path: qa-artifacts
          if-no-files-found: warn
