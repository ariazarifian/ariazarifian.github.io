# QA-only harness; Product bytes checked out by exact SHA and never mutated.
name: Atlas PEX-D1H United Kingdom rebased exact-byte QA
on:
  push:
    branches: [ops/atlas-pex-d1h-uk-rcurrent2-qa-20260923]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build bounded QA harness and checkout exact Product candidate
        run: |
          cat > /tmp/uk-qa.cjs <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const {chromium}=require('playwright');
          const PRODUCT='3a3ac7ff01a75730d3d2aa80a621361cafc78d75',BASE='d6c2e05ae746f961a8a31655cbe341802c748ac0',URL='http://127.0.0.1:8000/atlas-exit/index.html';
          const report={productHead:PRODUCT,baseHead:BASE,viewports:[],errors:[]};
          const log=(vp,s)=>console.log(`STAGE ${vp} ${s}`);
          async function choose(page,name,id,panelSel){await page.locator('#countrySearch').fill(name);await page.waitForTimeout(100);const row=page.locator(`[data-country="${id}"]`).first();await row.waitFor({state:'attached'});await row.evaluate(el=>el.click());await page.waitForSelector(panelSel);return page.locator(panelSel);}
          async function runViewport(browser,vp){
            log(vp.name,'context');
            const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height}});const page=await ctx.newPage();page.setDefaultTimeout(7000);page.setDefaultNavigationTimeout(10000);const errs=[];
            page.on('pageerror',e=>errs.push('page:'+String(e)));
            page.on('console',m=>{if(m.type()==='error'&&!/umami|ERR_FAILED|Failed to load resource/i.test(m.text()))errs.push('console:'+m.text())});
            page.on('requestfailed',r=>{try{const u=new URL(r.url());if(u.origin==='http://127.0.0.1:8000')errs.push('network:'+r.url()+':'+(r.failure()?.errorText||''));}catch{}});
            log(vp.name,'goto');await page.goto(URL,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.AtlasExplorer?.ready?.()&&window.ATLAS_COUNTRY_EVIDENCE_UNITED_KINGDOM?.validation?.ok===true,null,{timeout:12000});
            await page.waitForFunction(()=>window.AtlasExplorer.getCountries().find(c=>c.id==='GBR')?.tax===null,null,{timeout:8000});
            assert.equal(await page.evaluate(()=>document.fonts.check('12px Manrope')),true);assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true);
            if(vp.name==='mobile'){await page.locator('#mobileFilters').evaluate(el=>el.click());assert.equal(await page.locator('#mobileFilters').getAttribute('aria-expanded'),'true');}
            log(vp.name,'contract');
            const c=await page.evaluate(()=>{const e=ATLAS_COUNTRY_EVIDENCE,g=e.countries.GBR,x=AtlasExplorer.getCountries().find(y=>y.id==='GBR');return{keys:Object.keys(g.fields),required:e.requiredFields,states:Object.values(g.fields).map(v=>v.state),counts:Object.fromEntries(Object.entries(g.fields).map(([k,v])=>[k,e.sourcesFor(v).length])),tax:x.tax,taxLabel:x.taxLabel,scope:x.scope,srt:g.fields.tax_residency.structure,pit:g.fields.pit.structure,corp:g.fields.cit_business.structure,visa:g.fields.residence_visa.structure,health:g.fields.healthcare.structure,res:e.sourcesFor(g.fields.residence_visa).map(s=>s.locator),care:e.sourcesFor(g.fields.healthcare).map(s=>s.locator)};});
            assert.deepEqual(c.keys,c.required);assert.equal(c.states.filter(x=>x==='READY_FOR_PRODUCT').length,8);assert.deepEqual(c.counts,{tax_residency:1,pit:1,cit_business:1,consumption_tax:1,cost_context:1,residence_visa:3,healthcare:2,safety_context:1});assert.equal(c.tax,null);assert.match(c.taxLabel,/Écosse distincte/);assert.equal(c.srt.universal183DayRule,false);assert.equal(c.pit.scotlandSeparateSchedule,true);assert.equal(c.pit.ukWideScalarForbidden,true);assert.equal(c.corp.smallProfitsRate,19);assert.equal(c.corp.mainRate,25);assert.equal(c.corp.marginalReliefBetween,true);assert.equal(c.visa.etaWorkPermission,false);assert.equal(c.visa.etaResidencePermission,false);assert.equal(c.health.automaticNhsFromFrenchNationality,false);assert.equal(c.res.length,3);assert.equal(c.care.length,2);
            log(vp.name,'uk');
            let p=await choose(page,'Royaume-Uni','GBR','[data-atlas-united-kingdom-evidence][data-country="GBR"]');assert.equal(await p.getAttribute('open'),null);assert.equal(await p.locator('[data-evidence-field]').count(),8);assert.equal(await p.locator('a.detail-source').count(),11);assert.ok((await p.locator('.atlas-evidence__row>p').evaluateAll(es=>es.map(e=>getComputedStyle(e).display))).every(x=>x==='none'));await p.locator(':scope > summary').evaluate(el=>el.click());assert.notEqual(await p.getAttribute('open'),null);const t=await p.innerText();for(const re of [/183 jours/,/20–45 % E\/W\/NI/,/19 %/,/20 % standard/,/676,60 £/,/ETA visite/,/NHS \/ IHS/,/Vigilance normale/])assert.match(t,re);const src=p.locator('.atlas-evidence__source').first();await src.locator('summary').evaluate(el=>el.click());assert.equal(await src.locator('a.detail-source').isVisible(),true);assert.equal(await page.locator('#inspector').evaluate(el=>el.scrollWidth<=el.clientWidth+1),true);assert.doesNotMatch(await page.locator('#inspector').innerText(),/Découvrir/);await page.locator('[data-save="GBR"]').evaluate(el=>el.click());
            log(vp.name,'canada');p=await choose(page,'Canada','CAN','[data-atlas-canada-evidence][data-country="CAN"]');assert.equal(await p.locator('[data-evidence-field]').count(),8);assert.equal(await p.locator('a.detail-source').count(),11);assert.ok((await p.locator('.atlas-evidence__row>p').evaluateAll(es=>es.map(e=>getComputedStyle(e).display))).every(x=>x==='none'));assert.equal(await page.locator('#inspector').evaluate(el=>el.scrollWidth<=el.clientWidth+1),true);await page.locator('[data-save="CAN"]').evaluate(el=>el.click());assert.equal(await page.locator('#savedCount').textContent(),'2');
            log(vp.name,'singapore');p=await choose(page,'Singapour','SGP','[data-atlas-singapore-evidence][data-country="SGP"]');assert.equal(await p.locator('[data-evidence-field]').count(),8);assert.equal(await page.locator('#inspector').evaluate(el=>el.scrollWidth<=el.clientWidth+1),true);
            log(vp.name,'conflict');assert.equal(await page.locator('[data-layer="stability"]').count(),1);assert.equal(await page.locator('[data-layer="conflict"]').count(),1);await page.locator('[data-layer="conflict"]').evaluate(el=>el.click());await page.waitForFunction(()=>document.querySelector('[data-layer="conflict"]')?.getAttribute('aria-pressed')==='true');await choose(page,'Japon','JPN','[data-conflict-panel]');await page.waitForFunction(()=>/17:54/.test(document.querySelector('[data-conflict-panel]')?.textContent||''));let ct=await page.locator('[data-conflict-panel]').innerText();assert.match(ct,/590 km/);assert.match(ct,/70 km/);assert.match(ct,/modéré/i);await choose(page,'Thaïlande','THA','[data-conflict-panel]');await page.waitForFunction(()=>/Pattani|Cambodge/.test(document.querySelector('[data-conflict-panel]')?.textContent||''));ct=await page.locator('[data-conflict-panel]').innerText();assert.match(ct,/modéré/i);assert.match(ct,/Cambodge/);await page.locator('[data-layer="tax"]').evaluate(el=>el.click());
            log(vp.name,'search-filter-zoom');await page.locator('#countrySearch').fill('Royaume-Uni');await page.waitForTimeout(100);assert.equal(await page.locator('[data-country="GBR"]').count(),1);await page.locator('#countrySearch').fill('');await page.locator('[data-region="Europe"]').evaluate(el=>el.click());await page.waitForTimeout(100);assert.ok(Number((await page.locator('#resultCount').textContent()).match(/\d+/)?.[0]||0)>0);await page.locator('#resetFilters').evaluate(el=>el.click());const z=await page.locator('#zoomValue').textContent();await page.locator('#zoomIn').evaluate(el=>el.click());await page.waitForTimeout(100);assert.notEqual(await page.locator('#zoomValue').textContent(),z);
            log(vp.name,'comparator-open');await page.locator('#openCompare').evaluate(el=>el.click());await page.locator('#compareDialog').waitFor({state:'visible'});await page.waitForTimeout(250);log(vp.name,'comparator-read');const cmp=await page.locator('#compareTable').innerText();assert.match(cmp,/Royaume-Uni/);assert.match(cmp,/Canada/);assert.match(cmp,/E\/W\/NI 20–45 %/);assert.match(cmp,/19 % petites bénéfices/);assert.match(cmp,/20 % standard/);assert.ok(await page.locator('#compareTable [data-atlas-normalized="GBR"]').count()>=5);assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true);
            log(vp.name,'screenshot');fs.mkdirSync('qa-artifacts',{recursive:true});await page.screenshot({path:`qa-artifacts/uk-${vp.name}.png`,animations:'disabled',timeout:7000});assert.deepEqual(errs,[]);report.viewports.push({...vp,passed:true});report.errors.push(...errs.map(e=>vp.name+':'+e));log(vp.name,'pass');await ctx.close();
          }
          (async()=>{const browser=await chromium.launch({headless:true});try{for(const vp of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}])await runViewport(browser,vp);}finally{await browser.close();}fs.writeFileSync('qa-artifacts/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));})().catch(e=>{console.error('QA_FAIL',e);process.exit(1)});
          JS
          node --check /tmp/uk-qa.cjs
          git checkout --detach 3a3ac7ff01a75730d3d2aa80a621361cafc78d75
      - name: Syntax, lineage and bounded Product scope
        run: |
          test "$(git rev-parse HEAD^)" = "d6c2e05ae746f961a8a31655cbe341802c748ac0"
          node --check atlas-exit/country-evidence-united-kingdom.js
          test "$(git diff --name-only d6c2e05ae746f961a8a31655cbe341802c748ac0 3a3ac7ff01a75730d3d2aa80a621361cafc78d75 -- atlas-exit | sort)" = "$(printf '%s\n' atlas-exit/country-evidence-united-kingdom.js atlas-exit/index.html | sort)"
          git diff --exit-code d6c2e05ae746f961a8a31655cbe341802c748ac0 3a3ac7ff01a75730d3d2aa80a621361cafc78d75 -- atlas-exit/sitemap.xml
          test "$(grep -o "state:'READY_FOR_PRODUCT'" atlas-exit/country-evidence-united-kingdom.js | wc -l | tr -d ' ')" = "8"
          ! grep -q 'data-atlas-united-kingdom-evidence data-country="GBR" open' atlas-exit/country-evidence-united-kingdom.js
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact Product candidate
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/atlas-exit/index.html >/dev/null && break; sleep 1; done
      - name: Real Chromium bounded desktop/mobile gate
        run: |
          mkdir -p qa-artifacts
          timeout 120s env NODE_PATH="$PWD/node_modules" node /tmp/uk-qa.cjs
      - name: Shared readability and adjacent invariants unchanged
        run: |
          git diff --exit-code d6c2e05ae746f961a8a31655cbe341802c748ac0 3a3ac7ff01a75730d3d2aa80a621361cafc78d75 -- atlas-exit/country-evidence.js atlas-exit/atlas-country-evidence.css atlas-exit/script.js atlas-exit/conflict-tensions.js atlas-exit/conflict-tensions.css atlas-exit/country-evidence-australia.js atlas-exit/country-evidence-spain.js atlas-exit/country-evidence-japan.js atlas-exit/country-evidence-switzerland.js atlas-exit/country-evidence-singapore.js atlas-exit/country-evidence-canada.js atlas-exit/offres.html atlas-exit/parcours-usa.html atlas-exit/accompagnement.html atlas-exit/atlas-events.js atlas-exit/sitemap.xml atlas-exit/robots.txt
          grep -q '.atlas-evidence__row>p{display:none}' atlas-exit/atlas-country-evidence.css
          ! grep -q '>Découvrir<' atlas-exit/index.html
          grep -q 'Stabilité politique' atlas-exit/index.html
          grep -q 'Conflit & tensions' atlas-exit/index.html
          grep -q 'atlas-v15-cover.webp' atlas-exit/offres.html
          grep -q 'guide_download_click' atlas-exit/offres.html
          grep -q 'free_funnel_cta' atlas-exit/offres.html
          grep -q 'https://atlas-expat.fr/parcours-usa.html' atlas-exit/sitemap.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-pex-d1h-united-kingdom-rcurrent2-qa
          path: qa-artifacts
          if-no-files-found: warn
