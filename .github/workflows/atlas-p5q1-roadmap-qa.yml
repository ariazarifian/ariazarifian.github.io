name: ATLAS P5Q1 Roadmap Candidate QA

on:
  push:
    branches:
      - ops/atlas-p5q1-roadmap-qa-20260921

permissions:
  contents: read

jobs:
  roadmap-candidate-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify bounded candidate and behavior assets
        shell: bash
        run: |
          set -euo pipefail
          BASE=25fd865a2150aa2e9f55c9f4463d01d6e2360d6c
          CANDIDATE=a537da1e0ab9ec3c46503de0a21d6f42b27a59d7
          test "$(git hash-object atlas-exit/parcours-usa.html)" = "cad60b30fc2b20c80531ca9e872a977c0538e436"
          test "$(git hash-object atlas-exit/atlas-ui-roadmap.css)" = "359c05678215b5cc920c8d20fe410c286568fd8b"
          test "$(git hash-object atlas-exit/parcours-usa.js)" = "c28941375f4c2b87183e816d65bb3ae66d4c15e3"
          test "$(git hash-object atlas-exit/atlas-events.js)" = "acdc41734734c21bddf71f0e05047265274a74ec"
          test "$(git hash-object atlas-exit/atlas-ui.css)" = "a4af3e0236c6622a5488fa7836bca100922f382f"
          git diff --name-only "$BASE" "$CANDIDATE" | sort > /tmp/changed.txt
          printf '%s\n' atlas-exit/atlas-ui-roadmap.css atlas-exit/parcours-usa.html | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

          grep -q 'atlas-ui-roadmap.css?v=p5q1-1' atlas-exit/parcours-usa.html
          test "$(grep -o 'data-card-step=' atlas-exit/parcours-usa.html | wc -l)" -eq 8
          test "$(grep -o 'data-step=' atlas-exit/parcours-usa.html | wc -l)" -eq 8
          test "$(grep -o 'class=\"rm-phase\"' atlas-exit/parcours-usa.html | wc -l)" -eq 3
          grep -q 'id="routeForm"' atlas-exit/parcours-usa.html
          grep -q 'id="routeSummary"' atlas-exit/parcours-usa.html
          grep -q 'id="resetRoute"' atlas-exit/parcours-usa.html
          grep -q 'id="doneCount"' atlas-exit/parcours-usa.html
          grep -q 'id="progressBar"' atlas-exit/parcours-usa.html
          grep -q 'id="progressText"' atlas-exit/parcours-usa.html
          ! grep -E -q 'fonts\.googleapis\.com|fonts\.gstatic\.com|Georgia|Times New Roman' atlas-exit/parcours-usa.html
          ! grep -q '<style' atlas-exit/parcours-usa.html

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Capture before-after and run full lifecycle regression
        shell: bash
        run: |
          python -m http.server 8765 --directory atlas-exit >/tmp/p5q1-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > /tmp/qa.py <<'PY'
          import json, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          LIVE=f'https://atlas-expat.fr/parcours-usa.html?qa=p5q1-{int(time.time())}'
          CAND='http://127.0.0.1:8765/parcours-usa.html'
          out=Path('qa-artifacts'); out.mkdir(exist_ok=True)
          report={
            'candidate_commit':'a537da1e0ab9ec3c46503de0a21d6f42b27a59d7',
            'candidate_base':'25fd865a2150aa2e9f55c9f4463d01d6e2360d6c',
            'candidate_html_blob':'cad60b30fc2b20c80531ca9e872a977c0538e436',
            'candidate_css_blob':'359c05678215b5cc920c8d20fe410c286568fd8b',
            'roadmap_js_blob':'c28941375f4c2b87183e816d65bb3ae66d4c15e3',
            'events_js_blob':'acdc41734734c21bddf71f0e05047265274a74ec',
            'shared_css_blob':'a4af3e0236c6622a5488fa7836bca100922f382f',
            'before':{}, 'after':{}
          }

          init="""
          window.__atlasEvents=[];
          window.ATLAS_EVENT_COLLECTOR=(name,payload)=>{window.__atlasEvents.push({name,payload});return true;};
          """

          def overflow(page,w):
              g=page.evaluate("""() => ({doc:document.documentElement.scrollWidth,body:document.body.scrollWidth,vw:innerWidth})""")
              assert g['doc'] <= w+1 and g['body'] <= w+1, g
              return g

          def shell_checks(page,label,viewport):
              g=overflow(page,viewport['width'])
              shell=page.evaluate("""() => {
                const resources=performance.getEntriesByType('resource').map(e=>e.name);
                const b=getComputedStyle(document.body),h=getComputedStyle(document.querySelector('h1'));
                return {bodyFont:b.fontFamily,h1Font:h.fontFamily,fontsStatus:document.fonts.status,
                  manropeReady:document.fonts.check('16px Manrope'),
                  manrope:resources.filter(x=>x.includes('Manrope-Variable.ttf')),
                  forbidden:resources.filter(x=>x.includes('fonts.googleapis.com')||x.includes('fonts.gstatic.com')),
                  roadmapCss:resources.filter(x=>x.includes('atlas-ui-roadmap.css')),
                  styleBlocks:document.querySelectorAll('style').length};
              }""")
              assert shell['fontsStatus']=='loaded' and shell['manropeReady'] and shell['manrope'],shell
              assert 'Manrope' in shell['bodyFont'] and 'Manrope' in shell['h1Font'],shell
              assert not shell['forbidden'] and shell['styleBlocks']==0,shell
              nav=page.locator('.atlas-shell__nav a'); assert nav.count()==4
              nav_info=[]
              for i in range(4):
                  a=nav.nth(i); box=a.bounding_box(); fs=a.evaluate('el=>parseFloat(getComputedStyle(el).fontSize)')
                  assert box and box['x']>=-1 and box['x']+box['width']<=viewport['width']+1,(label,box)
                  if label=='mobile':
                      assert fs>=13,(a.inner_text(),fs)
                      assert box['height']>=42,(a.inner_text(),box)
                  nav_info.append({'text':a.inner_text(),'fontSize':fs,'height':box['height'],'current':a.get_attribute('aria-current')})
              assert sum(1 for x in nav_info if x['current']=='page')==1
              return g,shell,nav_info

          def capture_live(browser,label,viewport):
              p=browser.new_page(viewport=viewport)
              r=p.goto(LIVE,wait_until='domcontentloaded',timeout=45000)
              assert r and r.ok,(label,r.status if r else None)
              p.evaluate('document.fonts.ready'); p.wait_for_timeout(700)
              g=overflow(p,viewport['width'])
              assert p.locator('#routeForm').count()==1
              assert p.locator('[data-card-step]').count()==8
              p.screenshot(path=str(out/f'before-{label}.png'),full_page=True)
              info={'status':r.status,'overflow':g,'h1':p.locator('h1').inner_text(),'height':p.evaluate('document.documentElement.scrollHeight')}
              p.close(); return info

          def candidate(browser,label,viewport):
              page=browser.new_page(viewport=viewport,reduced_motion='no-preference')
              page.add_init_script(init)
              errors=[]
              page.on('pageerror',lambda e: errors.append(str(e)))
              r=page.goto(CAND,wait_until='domcontentloaded',timeout=45000)
              assert r and r.ok,(label,r.status if r else None)
              page.evaluate('document.fonts.ready'); page.wait_for_timeout(500)
              g,shell,nav=shell_checks(page,label,viewport)
              assert shell['roadmapCss'],shell
              assert page.locator('.rm-phase').count()==3
              assert page.locator('[data-card-step]').count()==8
              assert page.locator('[data-step]').count()==8
              assert page.locator('#doneCount').inner_text()=='0'
              assert page.locator('#routeSummary').is_hidden()
              assert page.locator('#resumeRoute').is_hidden()
              assert page.evaluate("localStorage.getItem('atlas_usa_route_v3')") is None
              assert page.evaluate("localStorage.getItem('atlas_usa_qep_v1')") is None
              assert page.evaluate('window.__atlasEvents')==[]
              page.screenshot(path=str(out/f'after-{label}-fresh.png'),full_page=True)

              page.select_option('#profile','business')
              page.select_option('#horizon','3-6')
              page.fill('#city','Austin')
              page.select_option('#priority','tax')
              page.locator('#routeForm button[type="submit"]').click()
              page.wait_for_timeout(250)
              assert page.locator('#routeSummary').is_visible()
              assert page.locator('#doneCount').inner_text()=='0'
              events=page.evaluate('window.__atlasEvents')
              names=[e['name'] for e in events]
              assert names==['route_started','qualified_project','roadmap_saved'],events
              qeps=[e for e in events if e['name']=='qualified_project']
              assert len(qeps)==1 and qeps[0]['payload']=={
                'origin':'FR','destination':'US','horizon_bucket':'3-6','route_version':'usa-v3','meaningful_action':'route_saved'
              },qeps
              marker=json.loads(page.evaluate("localStorage.getItem('atlas_usa_qep_v1')"))
              assert marker=={'route_version':'usa-v3','status':'sent'},marker

              checks=page.locator('[data-step]')
              for i in range(3): checks.nth(i).check()
              assert page.locator('#doneCount').inner_text()=='3'
              assert [e['name'] for e in page.evaluate('window.__atlasEvents')]==names
              state=json.loads(page.evaluate("localStorage.getItem('atlas_usa_route_v3')"))
              assert state['answers']['profile']=='business' and state['answers']['city']=='Austin'
              assert sum(1 for v in state['steps'].values() if v)==3,state
              page.screenshot(path=str(out/f'after-{label}-active.png'),full_page=True)
              active_overflow=overflow(page,viewport['width'])

              page.reload(wait_until='domcontentloaded'); page.evaluate('document.fonts.ready'); page.wait_for_timeout(250)
              assert page.locator('#doneCount').inner_text()=='3'
              assert page.locator('#routeSummary').is_visible()
              assert page.locator('#resumeRoute').is_visible()
              assert page.locator('#resumeRoute').inner_text()=='Reprendre à l’étape 4 →'
              returned=page.evaluate('window.__atlasEvents')
              assert [e['name'] for e in returned]==['roadmap_returned'],returned
              page.locator('#resumeRoute').click(); page.wait_for_timeout(120)
              focused=page.evaluate("document.activeElement && document.activeElement.getAttribute('data-step')")
              assert focused=='landing',focused

              checks=page.locator('[data-step]')
              for i in range(3,8): checks.nth(i).check()
              assert page.locator('#doneCount').inner_text()=='8'
              completed=page.evaluate('window.__atlasEvents')
              assert [e['name'] for e in completed]==['roadmap_returned','route_completed'],completed
              assert sum(1 for e in completed if e['name']=='qualified_project')==0

              page.reload(wait_until='domcontentloaded'); page.wait_for_timeout(200)
              assert page.locator('#doneCount').inner_text()=='8'
              assert page.locator('#resumeRoute').inner_text()=='Revoir ma roadmap →'
              complete_reload=page.evaluate('window.__atlasEvents')
              assert [e['name'] for e in complete_reload]==['roadmap_returned'],complete_reload

              page.locator('#resetRoute').click()
              assert page.locator('#doneCount').inner_text()=='0'
              assert page.locator('#routeSummary').is_hidden()
              assert page.locator('#resumeRoute').is_hidden()
              assert page.evaluate("localStorage.getItem('atlas_usa_route_v3')") is None
              assert page.evaluate("localStorage.getItem('atlas_usa_qep_v1')") is None

              page.select_option('#horizon','6-12')
              page.locator('#routeForm button[type="submit"]').click(); page.wait_for_timeout(150)
              post_reset=page.evaluate('window.__atlasEvents')
              post_qeps=[e for e in post_reset if e['name']=='qualified_project']
              assert len(post_qeps)==1 and post_qeps[0]['payload']['horizon_bucket']=='6-12',post_reset
              assert json.loads(page.evaluate("localStorage.getItem('atlas_usa_qep_v1')"))['status']=='sent'
              final_overflow=overflow(page,viewport['width'])
              assert not errors,errors

              reduced=browser.new_page(viewport=viewport,reduced_motion='reduce')
              reduced.goto(CAND,wait_until='domcontentloaded',timeout=45000); reduced.wait_for_timeout(150)
              d=reduced.locator('.step').first.evaluate('el=>getComputedStyle(el).transitionDuration')
              assert d in ('0s','0.00001s','0.01ms','1e-05s'),d
              reduced.close()

              info={'status':r.status,'overflow':g,'activeOverflow':active_overflow,'finalOverflow':final_overflow,
                    'shell':shell,'nav':nav,'phaseCount':3,'stepCount':8,
                    'freshEvents':[],'firstSaveEvents':names,'qepExactlyOnce':True,
                    'resumeAt4Focused':'landing','completedEvents':['roadmap_returned','route_completed'],
                    'completeReloadEvents':['roadmap_returned'],'resetClearsRouteAndQep':True,
                    'newRouteAfterResetQep':True,'reducedMotion':d,
                    'height':page.evaluate('document.documentElement.scrollHeight')}
              page.close(); return info

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for label,vp in [('desktop',{'width':1440,'height':1000}),('mobile',{'width':390,'height':844})]:
                  report['before'][label]=capture_live(browser,label,vp)
                  report['after'][label]=candidate(browser,label,vp)
              browser.close()

          Path('qa-artifacts/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          python /tmp/qa.py

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-p5q1-roadmap-before-after
          path: qa-artifacts
          if-no-files-found: error
