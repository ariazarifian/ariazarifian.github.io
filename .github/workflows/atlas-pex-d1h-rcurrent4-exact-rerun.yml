name: Atlas PEX-D1H UK rcurrent4 exact candidate rerun
on:
  push:
    branches: [ops/atlas-pex-d1h-uk-rcurrent2-qa-20260923]
permissions:
  contents: read
jobs:
  exact-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact unchanged Product candidate
        run: git checkout --detach 1c65748419c702d88255bcafc537ab792d3bde8f
      - name: Lineage scope semantics preservation
        shell: bash
        run: |
          set -euo pipefail
          BASE=d6c2e05ae746f961a8a31655cbe341802c748ac0
          C=1c65748419c702d88255bcafc537ab792d3bde8f
          test "$(git rev-parse HEAD)" = "$C"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git diff --name-only "$BASE" "$C" | sort)" = "$(printf '%s\n' atlas-exit/country-evidence-united-kingdom.js atlas-exit/index.html | sort)"
          git diff --exit-code "$BASE" "$C" -- atlas-exit/sitemap.xml
          node --check atlas-exit/country-evidence-united-kingdom.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('atlas-exit/country-evidence-united-kingdom.js').read_text()
          assert s.count("state:'READY_FOR_PRODUCT'")==8
          for x in ['day183OnlyOneRoute:true','universal183DayRule:false','scotlandSeparateSchedule:true','ukWideScalarForbidden:true','smallProfitsRate:19','mainRate:25','marginalReliefBetween:true','associatedCompanyAdjustments:true','shortAccountingPeriodAdjustments:true','etaWorkPermission:false','etaResidencePermission:false','automaticNhsFromFrenchNationality:false',"if(!target||target.dataset.atlasNormalized==='GBR')return"]: assert x in s,x
          assert 'data-atlas-united-kingdom-evidence data-country="GBR" open' not in s
          i=Path('atlas-exit/index.html').read_text(); assert '>Découvrir<' not in i and 'Stabilité politique' in i and 'Conflit & tensions' in i and 'country-evidence-united-kingdom.js' in i
          assert '.atlas-evidence__row>p{display:none' in Path('atlas-exit/atlas-country-evidence.css').read_text()
          off=Path('atlas-exit/offres.html').read_text(); assert 'assets/atlas-v15-cover.webp' in off and 'guide_download_click' in off and 'free_funnel_cta' in off
          assert 'https://atlas-expat.fr/parcours-usa.html' in Path('atlas-exit/sitemap.xml').read_text()
          print('STATIC_EXACT_PASS')
          PY
      - name: Install Chromium
        run: |
          mkdir -p /tmp/ukqa && cd /tmp/ukqa
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact candidate
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/atlas-exit/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/http.log; exit 1
      - name: Chromium desktop mobile full gate
        run: |
          mkdir -p qa-artifacts
          cat > /tmp/qa.cjs <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const {chromium}=require('/tmp/ukqa/node_modules/playwright');
          const O='http://127.0.0.1:8000',U=O+'/atlas-exit/index.html',C='1c65748419c702d88255bcafc537ab792d3bde8f',B='d6c2e05ae746f961a8a31655cbe341802c748ac0';
          const report={candidate:C,base:B,viewports:[],adjacent:{},errors:[]};
          const stage=(v,s)=>console.log('STAGE',v,s);
          async function choose(p,name,id,sel){await p.locator('#countrySearch').fill(name);await p.waitForTimeout(120);const r=p.locator(`[data-country="${id}"]`).first();await r.waitFor({state:'attached'});await r.click({force:true});await p.waitForSelector(sel,{state:'attached'});return p.locator(sel).first()}
          async function one(browser,v){const ctx=await browser.newContext({viewport:{width:v.w,height:v.h},reducedMotion:'reduce'}),p=await ctx.newPage();p.setDefaultTimeout(7000);const errs=[];p.on('pageerror',e=>errs.push('page:'+e));p.on('console',m=>{if(m.type()==='error'&&!/umami|ERR_FAILED|Failed to load resource/i.test(m.text()))errs.push('console:'+m.text())});p.on('requestfailed',r=>{try{if(new URL(r.url()).origin===O)errs.push('network:'+r.url()+':'+(r.failure()?.errorText||''))}catch{}});
            stage(v.n,'goto');await p.goto(U,{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>AtlasExplorer?.ready?.()&&ATLAS_COUNTRY_EVIDENCE_UNITED_KINGDOM?.validation?.ok===true,null,{timeout:12000});await p.waitForFunction(()=>AtlasExplorer.getCountries().find(c=>c.id==='GBR')?.tax===null);
            assert.equal(await p.evaluate(()=>document.fonts.check('12px Manrope')),true);assert.equal(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true);if(v.n==='mobile'){await p.locator('#mobileFilters').click({force:true});assert.equal(await p.locator('#mobileFilters').getAttribute('aria-expanded'),'true')}
            stage(v.n,'contract');const c=await p.evaluate(()=>{const e=ATLAS_COUNTRY_EVIDENCE,g=e.countries.GBR,x=AtlasExplorer.getCountries().find(y=>y.id==='GBR');return{keys:Object.keys(g.fields),required:e.requiredFields,states:Object.values(g.fields).map(z=>z.state),counts:Object.fromEntries(Object.entries(g.fields).map(([k,z])=>[k,e.sourcesFor(z).length])),urls:Object.values(g.fields).flatMap(z=>e.sourcesFor(z).map(s=>s.locator)),tax:x.tax,taxLabel:x.taxLabel,scope:x.scope,srt:g.fields.tax_residency.structure,pit:g.fields.pit.structure,corp:g.fields.cit_business.structure,visa:g.fields.residence_visa.structure,health:g.fields.healthcare.structure}});assert.deepEqual(c.keys,c.required);assert.equal(c.states.filter(x=>x==='READY_FOR_PRODUCT').length,8);assert.deepEqual(c.counts,{tax_residency:1,pit:1,cit_business:1,consumption_tax:1,cost_context:1,residence_visa:3,healthcare:2,safety_context:1});assert.equal(c.urls.length,11);assert.equal(new Set(c.urls).size,11);assert.equal(c.tax,null);assert.match(c.taxLabel,/Écosse distincte/);assert.match(c.scope,/Écosse séparée/);assert.equal(c.srt.universal183DayRule,false);assert.equal(c.srt.day183OnlyOneRoute,true);assert.equal(c.pit.scotlandSeparateSchedule,true);assert.equal(c.pit.ukWideScalarForbidden,true);assert.equal(c.corp.smallProfitsRate,19);assert.equal(c.corp.mainRate,25);assert.equal(c.corp.marginalReliefBetween,true);assert.equal(c.visa.etaWorkPermission,false);assert.equal(c.visa.etaResidencePermission,false);assert.equal(c.health.automaticNhsFromFrenchNationality,false);
            stage(v.n,'uk');let d=await choose(p,'Royaume-Uni','GBR','[data-atlas-united-kingdom-evidence][data-country="GBR"]');assert.equal(await d.getAttribute('open'),null);assert.equal(await d.locator('[data-evidence-field]').count(),8);assert.equal(await d.locator('a.detail-source').count(),11);assert.ok((await d.locator('.atlas-evidence__row>p').evaluateAll(es=>es.map(e=>getComputedStyle(e).display))).every(x=>x==='none'));await d.locator(':scope > summary').click({force:true});assert.notEqual(await d.getAttribute('open'),null);const txt=await d.innerText();for(const re of [/183 jours/,/20–45 % E\/W\/NI/,/19 %/,/20 % standard/,/676,60 £/,/ETA visite/,/NHS \/ IHS/,/Vigilance normale/])assert.match(txt,re);const src=d.locator('.atlas-evidence__source').first();await src.locator('summary').click({force:true});assert.equal(await src.locator('a.detail-source').isVisible(),true);assert.equal(await p.locator('#inspector').evaluate(el=>el.scrollWidth<=el.clientWidth+1),true);assert.doesNotMatch(await p.locator('#inspector').innerText(),/Découvrir/);await p.locator('[data-save="GBR"]').click({force:true});
            stage(v.n,'canada');d=await choose(p,'Canada','CAN','[data-atlas-canada-evidence][data-country="CAN"]');assert.equal(await d.locator('[data-evidence-field]').count(),8);assert.ok((await d.locator('.atlas-evidence__row>p').evaluateAll(es=>es.map(e=>getComputedStyle(e).display))).every(x=>x==='none'));assert.equal(await p.locator('#inspector').evaluate(el=>el.scrollWidth<=el.clientWidth+1),true);await p.locator('[data-save="CAN"]').click({force:true});assert.equal((await p.locator('#savedCount').textContent()).trim(),'2');
            stage(v.n,'singapore');d=await choose(p,'Singapour','SGP','[data-atlas-singapore-evidence][data-country="SGP"]');assert.equal(await d.locator('[data-evidence-field]').count(),8);assert.equal(await p.locator('#inspector').evaluate(el=>el.scrollWidth<=el.clientWidth+1),true);
            stage(v.n,'conflict');await p.locator('[data-layer="conflict"]').click({force:true});await p.waitForFunction(()=>document.querySelector('[data-layer="conflict"]')?.getAttribute('aria-pressed')==='true');await choose(p,'Japon','JPN','[data-conflict-panel]');await p.waitForFunction(()=>/17:54/.test(document.querySelector('[data-conflict-panel]')?.textContent||''));let ct=await p.locator('[data-conflict-panel]').innerText();assert.match(ct,/590 km/);assert.match(ct,/70 km/);assert.match(ct,/modéré/i);await choose(p,'Thaïlande','THA','[data-conflict-panel]');await p.waitForFunction(()=>/Cambodge/.test(document.querySelector('[data-conflict-panel]')?.textContent||''));ct=await p.locator('[data-conflict-panel]').innerText();assert.match(ct,/modéré/i);assert.match(ct,/Cambodge/);await p.locator('[data-layer="tax"]').click({force:true});
            stage(v.n,'search-filter');await p.locator('#countrySearch').fill('Royaume-Uni');await p.waitForTimeout(100);assert.equal(await p.locator('[data-country="GBR"]').count(),1);await p.locator('#countrySearch').fill('');await p.locator('[data-region="Europe"]').click({force:true});await p.waitForTimeout(250);assert.ok(Number((await p.locator('#resultCount').textContent()).match(/\d+/)?.[0]||0)>0);
            stage(v.n,'zoom');await p.locator('#homeMap').click({force:true});await p.waitForTimeout(250);const before=await p.evaluate(()=>AtlasExplorer.state.k);await p.locator('#zoomIn').click({force:true});await p.waitForTimeout(350);const after=await p.evaluate(()=>AtlasExplorer.state.k);console.log('ZOOM',v.n,before,after);assert.ok(after>before+.01);
            stage(v.n,'compare');await p.locator('#openCompare').click({force:true});await p.locator('#compareDialog').waitFor({state:'visible',timeout:5000});const cmp=await p.locator('#compareTable').innerText({timeout:5000});assert.match(cmp,/Royaume-Uni/);assert.match(cmp,/Canada/);assert.match(cmp,/E\/W\/NI 20–45 %/);assert.match(cmp,/19 % petites bénéfices/);assert.match(cmp,/20 % standard/);assert.ok(await p.locator('#compareTable [data-atlas-normalized="GBR"]').count()>=5);assert.equal(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true);
            await p.screenshot({path:`qa-artifacts/uk-${v.n}.png`,animations:'disabled'});assert.deepEqual(errs,[]);report.viewports.push({name:v.n,width:v.w,height:v.h,passed:true,zoom:{before,after}});await ctx.close();stage(v.n,'PASS')}
          async function adjacent(browser){const ctx=await browser.newContext({viewport:{width:1280,height:900},reducedMotion:'reduce'});for(const[k,path,re]of[['guide','offres.html',/Télécharger/i],['roadmap','parcours-usa.html',/Roadmap/i],['accompagnement','accompagnement.html',/Accompagnement/i]]){const p=await ctx.newPage(),errs=[];p.on('pageerror',e=>errs.push(String(e)));p.on('requestfailed',r=>{try{if(new URL(r.url()).origin===O)errs.push(r.url())}catch{}});await p.goto(O+'/atlas-exit/'+path,{waitUntil:'domcontentloaded'});assert.match(await p.locator('body').innerText(),re);assert.equal(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true);assert.deepEqual(errs,[]);report.adjacent[k]={passed:true};await p.close()}await ctx.close()}
          (async()=>{const b=await chromium.launch({headless:true});try{await one(b,{n:'desktop',w:1440,h:1000});await one(b,{n:'mobile',w:390,h:844});await adjacent(b)}finally{await b.close()}fs.writeFileSync('qa-artifacts/report.json',JSON.stringify(report,null,2));console.log('PRODUCT_QA_PASS',JSON.stringify(report))})().catch(e=>{console.error('QA_FAIL',e);process.exit(1)});
          JS
          timeout 180s node /tmp/qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-pex-d1h-uk-rcurrent4-exact-rerun
          path: qa-artifacts
          if-no-files-found: warn
