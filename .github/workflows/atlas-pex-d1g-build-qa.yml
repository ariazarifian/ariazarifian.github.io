name: Atlas PEX-D1G Canada build and QA
on:
  push:
    branches:
      - ops/atlas-pex-d1g-build-helper-20260922
permissions:
  contents: write
jobs:
  build-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve helper scripts
        run: |
          cp scripts/pex_d1g_patch.py /tmp/pex_d1g_patch.py
          cp scripts/pex_d1g_qa.cjs /tmp/pex_d1g_qa.cjs
      - name: Checkout exact Product branch
        run: |
          git checkout ops/atlas-pex-d1g-canada-20260922
          test "$(git rev-parse HEAD)" = "bb8ac263a597a26265579c33181fdff824934bfd"
      - name: Apply deterministic Canada bridge patch
        run: |
          python3 /tmp/pex_d1g_patch.py
          node --check atlas-exit/country-evidence-canada.js
          node --check atlas-exit/fiscal-finalize.js
          test "$(git diff --name-only)" = "atlas-exit/fiscal-finalize.js"
      - name: Commit exact Product candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-exit/fiscal-finalize.js
          git commit -m 'PEX-D1G wire Canada evidence into Explorer'
          echo "PRODUCT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:refs/heads/ops/atlas-pex-d1g-canada-20260922
      - name: Bounded Product scope
        run: |
          node --check atlas-exit/country-evidence-canada.js
          node --check atlas-exit/country-evidence.js
          node --check atlas-exit/fiscal-finalize.js
          test "$(git diff --name-only dee08b010d9a5f25cb6d64e1d8c7dd89ae53eee4 "$PRODUCT_HEAD" -- atlas-exit | sort)" = "$(printf '%s\n' atlas-exit/country-evidence-canada.js atlas-exit/fiscal-finalize.js | sort)"
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact Product candidate
        run: |
          python3 -m http.server 8000 >/tmp/pex-d1g-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/atlas-exit/index.html >/dev/null && break; sleep 1; done
      - name: Real Chromium desktop and mobile plus evidence contract
        run: |
          mkdir -p qa-artifacts
          NODE_PATH="$PWD/node_modules" PRODUCT_HEAD="$PRODUCT_HEAD" node /tmp/pex_d1g_qa.cjs
      - name: Immutable shell regression
        run: |
          grep -q '@media(prefers-reduced-motion:reduce)' atlas-exit/atlas-country-evidence.css
          git diff --exit-code dee08b010d9a5f25cb6d64e1d8c7dd89ae53eee4 "$PRODUCT_HEAD" -- atlas-exit/country-evidence.js atlas-exit/country-evidence-australia.js atlas-exit/country-evidence-spain.js atlas-exit/country-evidence-japan.js atlas-exit/country-evidence-switzerland.js atlas-exit/country-evidence-singapore.js atlas-exit/atlas-country-evidence.css atlas-exit/index.html atlas-exit/script.js atlas-exit/atlas-events.js atlas-exit/sitemap.xml atlas-exit/robots.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-pex-d1g-canada-evidence-qa
          path: qa-artifacts
          if-no-files-found: warn
