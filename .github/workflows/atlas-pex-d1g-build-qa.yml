name: Atlas PEX-D1G Canada exact-candidate QA
on:
  push:
    branches:
      - ops/atlas-pex-d1g-build-helper-20260922
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve QA harness and relax legacy-store implementation assertion
        run: |
          cp scripts/pex_d1g_qa.cjs /tmp/pex_d1g_qa.cjs
          python3 -c "from pathlib import Path;p=Path('/tmp/pex_d1g_qa.cjs');s=p.read_text();old=\"assert.equal(runtime.cit,'15 % fédéral général');assert.equal(runtime.vat,'GST 5 % + HST/PST variables');\";new=\"assert.match(runtime.cit,/15 %/);assert.match(runtime.vat,/5 %/);\";assert old in s;p.write_text(s.replace(old,new,1))"
      - name: Checkout exact Product candidate
        run: |
          git checkout --detach 66372a4526191dbfd48c3d625a909a8aae895acc
          test "$(git rev-parse HEAD)" = "66372a4526191dbfd48c3d625a909a8aae895acc"
          echo "PRODUCT_HEAD=66372a4526191dbfd48c3d625a909a8aae895acc" >> "$GITHUB_ENV"
      - name: Contract syntax and bounded Product scope
        run: |
          node --check atlas-exit/country-evidence-canada.js
          node --check atlas-exit/country-evidence.js
          node --check atlas-exit/fiscal-finalize.js
          test "$(git diff --name-only dee08b010d9a5f25cb6d64e1d8c7dd89ae53eee4 66372a4526191dbfd48c3d625a909a8aae895acc -- atlas-exit | sort)" = "$(printf '%s\n' atlas-exit/country-evidence-canada.js atlas-exit/fiscal-finalize.js | sort)"
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact Product candidate
        run: |
          python3 -m http.server 8000 >/tmp/pex-d1g-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/atlas-exit/index.html >/dev/null && break; sleep 1; done
      - name: Real Chromium desktop and mobile plus evidence contract
        run: |
          mkdir -p qa-artifacts
          NODE_PATH="$PWD/node_modules" PRODUCT_HEAD="$PRODUCT_HEAD" node /tmp/pex_d1g_qa.cjs
      - name: Immutable shell regression
        run: |
          grep -q '@media(prefers-reduced-motion:reduce)' atlas-exit/atlas-country-evidence.css
          git diff --exit-code dee08b010d9a5f25cb6d64e1d8c7dd89ae53eee4 66372a4526191dbfd48c3d625a909a8aae895acc -- atlas-exit/country-evidence.js atlas-exit/country-evidence-australia.js atlas-exit/country-evidence-spain.js atlas-exit/country-evidence-japan.js atlas-exit/country-evidence-switzerland.js atlas-exit/country-evidence-singapore.js atlas-exit/atlas-country-evidence.css atlas-exit/index.html atlas-exit/script.js atlas-exit/atlas-events.js atlas-exit/sitemap.xml atlas-exit/robots.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-pex-d1g-canada-evidence-qa
          path: qa-artifacts
          if-no-files-found: warn
