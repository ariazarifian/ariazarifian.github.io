name: Atlas PEX-D1B Australia evidence QA
on:
  push:
    branches: [ops/atlas-pex-d1b-australia-fix-20260921]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contract fidelity and bounded scope
        env:
          PRODUCT_HEAD: c2be6f834b2c8b8978e645cb7e055591def9b00d
          BASE_HEAD: d70582d0a70967b828b74425f00de9e7597a0c32
        run: |
          git checkout --detach "$PRODUCT_HEAD"
          node --check atlas-exit/country-evidence-australia.js
          node --check atlas-exit/country-evidence.js
          node --check atlas-exit/fiscal-finalize.js
          node - <<'JS'
          const assert=require('node:assert/strict');
          const core=require('./atlas-exit/country-evidence.js');
          assert.equal(core.validateCountry(core.countries.THA).ok,true);
          require('./atlas-exit/country-evidence-australia.js');
          const e=globalThis.ATLAS_COUNTRY_EVIDENCE;
          const aus=e.countries.AUS;
          assert.ok(aus,'Australia must be published through normalized API');
          assert.equal(aus.integrationState,'published');
          assert.equal(e.validateCountry(aus).ok,true);
          assert.deepEqual(Object.keys(aus.fields),e.requiredFields);
          const expectedStates={tax_residency:'READY_WITH_CAVEAT',pit:'READY_WITH_CAVEAT',cit_business:'READY_WITH_CAVEAT',consumption_tax:'READY_FOR_PRODUCT',cost_context:'READY_WITH_CAVEAT',residence_visa:'READY_WITH_CAVEAT',healthcare:'READY_WITH_CAVEAT',safety_context:'READY_FOR_PRODUCT'};
          for(const [key,state] of Object.entries(expectedStates))assert.equal(aus.fields[key].state,state,key);
          assert.equal(e.sourcesFor(aus.fields.tax_residency).length,1);
          assert.equal(e.sourcesFor(aus.fields.pit).length,2);
          assert.equal(e.sourcesFor(aus.fields.cit_business).length,1);
          assert.equal(e.sourcesFor(aus.fields.consumption_tax).length,1);
          assert.equal(e.sourcesFor(aus.fields.cost_context).length,1);
          assert.equal(e.sourcesFor(aus.fields.residence_visa).length,2);
          assert.equal(e.sourcesFor(aus.fields.healthcare).length,2);
          assert.equal(e.sourcesFor(aus.fields.safety_context).length,1);
          assert.deepEqual(e.sourcesFor(aus.fields.pit).map(s=>s.locator),['https://budget.gov.au/content/02-cost-of-living.htm','https://www.ato.gov.au/law/view/document?DocNum=0000081364&FullDocument=true']);
          assert.deepEqual(e.sourcesFor(aus.fields.residence_visa).map(s=>s.locator),['https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/work-holiday-417','https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/evisitor-651']);
          assert.deepEqual(e.sourcesFor(aus.fields.healthcare).map(s=>s.locator),['https://www.servicesaustralia.gov.au/reciprocal-health-care-agreements','https://www.servicesaustralia.gov.au/enrolling-medicare']);
          assert.equal(aus.fields.pit.structure.allInScalarForbidden,true);
          assert.equal(aus.fields.healthcare.structure.rhcaCountry,false);
          assert.equal(aus.fields.safety_context.structure.scalarScoreForbidden,true);
          assert.deepEqual(aus.existingContext.legacyTaxContext.excludedFrom,['inspector','comparator']);
          assert.equal(e.countries.THA,core.countries.THA,'Thailand object identity must remain untouched');
          console.log('PEX-D1B normalized Australia contract PASS');
          JS
          test "$(git diff --name-only "$BASE_HEAD" "$PRODUCT_HEAD" -- atlas-exit | sort)" = "$(printf '%s\n' atlas-exit/country-evidence-australia.js atlas-exit/fiscal-finalize.js | sort)"
          git diff --exit-code "$BASE_HEAD" "$PRODUCT_HEAD" -- atlas-exit/country-evidence.js atlas-exit/atlas-country-evidence.css atlas-exit/index.html atlas-exit/script.js atlas-exit/atlas-events.js atlas-exit/catalog.js atlas-exit/commerce-data.js atlas-exit/tax-additions.js atlas-exit/corporate-world.js atlas-exit/consumption-world.js atlas-exit/sitemap.xml atlas-exit/robots.txt
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact Product candidate
        run: |
          git checkout --detach c2be6f834b2c8b8978e645cb7e055591def9b00d
          python3 -m http.server 8000 >/tmp/pex-d1b-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/atlas-exit/index.html >/dev/null && break; sleep 1; done
      - name: Real Chrome desktop and mobile
        run: |
          mkdir -p qa-artifacts
          cat >/tmp/qa.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const url='http://127.0.0.1:8000/atlas-exit/index.html';
          const report={productHead:'c2be6f834b2c8b8978e645cb7e055591def9b00d',baseHead:'d70582d0a70967b828b74425f00de9e7597a0c32',viewports:[],errors:[]};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const cfg of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]){
              const context=await browser.newContext({viewport:{width:cfg.width,height:cfg.height}});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error'&&!/umami|ERR_FAILED|Failed to load resource/i.test(m.text()))errors.push('console: '+m.text())});
              await page.goto(url,{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.querySelector('#resultCount')?.textContent&&!/Chargement/.test(document.querySelector('#resultCount').textContent),null,{timeout:15000});
              await page.waitForFunction(()=>window.ATLAS_COUNTRY_EVIDENCE?.countries?.AUS?.integrationState==='published',null,{timeout:10000});
              assert.equal(await page.evaluate(()=>document.fonts.check('12px Manrope')),true);
              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true);
              const z0=await page.locator('#zoomValue').textContent();
              await page.locator('#zoomIn').click(); await page.waitForTimeout(100);
              const z1=await page.locator('#zoomValue').textContent(); assert.notEqual(z0,z1);
              if(cfg.name==='mobile'){await page.locator('#mobileFilters').click();assert.equal(await page.locator('#mobileFilters').getAttribute('aria-expanded'),'true');}
              const runtime=await page.evaluate(()=>{const c=window.AtlasExplorer.getCountries().find(x=>x.id==='AUS');return {tax:c.tax,scope:c.scope,year:c.taxYear,taxStore:window.ATLAS_TAX.AUS.tax,bootstrap:window.ATLAS_FISCAL_FINALIZE.countryEvidenceBootstrap};});
              assert.equal(runtime.tax,45); assert.equal(runtime.taxStore,45); assert.equal(runtime.year,'2026–27'); assert.match(runtime.scope,/Medicare levy/); assert.equal(runtime.bootstrap,'pex-d1b-1');
              await page.locator('#countrySearch').fill('Australie'); await page.waitForTimeout(80);
              assert.equal(await page.locator('[data-country="AUS"]').count(),1);
              await page.locator('#taxRange').evaluate(el=>{el.value='45';el.dispatchEvent(new Event('input',{bubbles:true}));}); await page.waitForTimeout(80);
              assert.equal(await page.locator('[data-country="AUS"]').count(),1,'Australia remains at <=45 after reconciliation');
              await page.locator('#taxRange').evaluate(el=>{el.value='40';el.dispatchEvent(new Event('input',{bubbles:true}));}); await page.waitForTimeout(80);
              assert.equal(await page.locator('[data-country="AUS"]').count(),0,'Australia leaves <=40 filter');
              await page.locator('#taxRange').evaluate(el=>{el.value='60';el.dispatchEvent(new Event('input',{bubbles:true}));}); await page.waitForTimeout(80);
              await page.locator('[data-country="AUS"]').click({force:true});
              await page.waitForSelector('[data-atlas-australia-evidence][data-country="AUS"]');
              const panel=page.locator('[data-atlas-australia-evidence][data-country="AUS"]');
              assert.equal(await panel.locator('[data-evidence-field]').count(),8);
              assert.equal(await panel.locator('a.detail-source').count(),11);
              assert.equal(await panel.locator('[data-source-count="2"]').count(),3);
              const states=await panel.locator('[data-evidence-state]').evaluateAll(rows=>rows.map(x=>x.getAttribute('data-evidence-state')));
              assert.equal(states.filter(x=>x==='READY_WITH_CAVEAT').length,6);
              assert.equal(states.filter(x=>x==='READY_FOR_PRODUCT').length,2);
              const text=await panel.innerText();
              assert.match(text,/15–45 %/); assert.match(text,/30 % général/); assert.match(text,/10 % · GST/); assert.match(text,/Working Holiday/); assert.match(text,/Medicare/); assert.doesNotMatch(text,/Non documenté|À documenter/i);
              assert.equal(await page.locator('.tax-stack').evaluate(el=>el.hidden),true,'legacy inspector tax stack hidden for AUS');
              assert.equal(await page.locator('.source-disclosure').evaluate(el=>el.hidden),true,'legacy tax source disclosure hidden for AUS');
              const box=await page.locator('#inspector').boundingBox(); assert.ok(box&&box.x>=-1&&box.y>=-1&&box.x+box.width<=cfg.width+1&&box.y+box.height<=cfg.height+1);
              await page.locator('[data-save="AUS"]').click(); assert.equal(await page.locator('#savedCount').textContent(),'1');
              await page.locator('[data-dismiss]').click();
              await page.locator('#countrySearch').fill('Thaïlande'); await page.waitForTimeout(80); await page.locator('[data-country="THA"]').click({force:true});
              await page.waitForSelector('[data-atlas-evidence-panel][data-country="THA"]');
              const tha=page.locator('[data-atlas-evidence-panel][data-country="THA"]');
              assert.equal(await tha.locator('[data-evidence-field]').count(),8); assert.equal(await tha.locator('a.detail-source').count(),8);
              assert.equal(await page.locator('.tax-stack').evaluate(el=>el.hidden),false,'Thailand legacy stack remains unchanged');
              await page.locator('[data-save="THA"]').click(); assert.equal(await page.locator('#savedCount').textContent(),'2');
              await page.locator('#openCompare').click(); await page.locator('#compareDialog').waitFor({state:'visible'}); await page.waitForTimeout(80);
              const compare=await page.locator('#compareTable').innerText();
              assert.match(compare,/Australie/); assert.match(compare,/15–45 %/); assert.match(compare,/30 % général · 25 % si éligible/); assert.match(compare,/10 %/); assert.match(compare,/Medicare levy et offsets distincts/);
              assert.ok(await page.locator('#compareTable [data-atlas-normalized="AUS"]').count()>=5);
              await page.locator('#compareDialog [data-close]').click();
              await page.screenshot({path:`qa-artifacts/pex-d1b-${cfg.name}.png`,fullPage:false});
              const full=await page.screenshot({path:`qa-artifacts/pex-d1b-${cfg.name}-full.png`,fullPage:true});
              report.viewports.push({name:cfg.name,width:cfg.width,height:cfg.height,zoom:[z0,z1],runtime,fields:8,sourceLinks:11,multiSourceGroups:3,inspector:box,fullScreenshotBytes:full.length});
              report.errors.push(...errors.map(x=>`${cfg.name}: ${x}`)); assert.deepEqual(errors,[]);
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('qa-artifacts/pex-d1b-report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
          })().catch(e=>{fs.writeFileSync('qa-artifacts/pex-d1b-error.txt',String(e?.stack||e));console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/qa.cjs
      - name: Reduced motion and immutable shell
        run: |
          grep -q '@media(prefers-reduced-motion:reduce)' atlas-exit/atlas-country-evidence.css
          git diff --exit-code d70582d0a70967b828b74425f00de9e7597a0c32 c2be6f834b2c8b8978e645cb7e055591def9b00d -- atlas-exit/country-evidence.js atlas-exit/atlas-country-evidence.css atlas-exit/index.html atlas-exit/script.js atlas-exit/atlas-events.js atlas-exit/sitemap.xml atlas-exit/robots.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-pex-d1b-australia-evidence-qa
          path: qa-artifacts
          if-no-files-found: error
