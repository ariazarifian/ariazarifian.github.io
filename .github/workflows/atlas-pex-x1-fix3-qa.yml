name: Atlas PEX-X1 FIX3 QA
on:
  push:
    branches: [ops/atlas-pex-x1-fix3-qa-20260923]
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Compose bounded candidate on current live
        env:
          LIVE: 2064d6f96b80156d19973d2332ee9f652d5a57ef
          SRC: 7a58d04b240ab33cf75ffb0d1c823913833e373e
        run: |
          git checkout --detach "$LIVE"
          git checkout -b ops/atlas-pex-x1-fix3-20260923
          git show "${SRC}:atlas-exit/conflict-tensions.css" > atlas-exit/conflict-tensions.css
          git show "${SRC}:atlas-exit/conflict-tensions.js" > atlas-exit/conflict-tensions.js
          git show "${SRC}:atlas-exit/index.html" > atlas-exit/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('atlas-exit/conflict-tensions.js')
          s=p.read_text()
          old="if(inspector)new MutationObserver(()=>{if(active)augmentInspector()}).observe(inspector,{childList:true});"
          new="if(inspector)new MutationObserver(()=>{if(active)requestAnimationFrame(()=>augmentInspector())}).observe(inspector,{childList:true,subtree:true});"
          assert old in s
          p.write_text(s.replace(old,new))
          PY
          node --check atlas-exit/conflict-tensions.js
          git add atlas-exit/conflict-tensions.css atlas-exit/conflict-tensions.js atlas-exit/index.html
          expected="$(printf '%s\n' atlas-exit/conflict-tensions.css atlas-exit/conflict-tensions.js atlas-exit/index.html | sort)"
          actual="$(git diff --cached --name-only "$LIVE" | sort)"
          test "$actual" = "$expected"
          git diff --cached --check "$LIVE"
          grep -F 'data-layer="conflict"' atlas-exit/index.html
          ! grep -F 'data-layer="explore"' atlas-exit/index.html
          grep -F 'Stabilité politique' atlas-exit/index.html
          grep -F 'subtree:true' atlas-exit/conflict-tensions.js
          git config user.name 'ATLAS Product Executor'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(atlas): PEX-X1 conflict signal after readability hotfix'
      - name: Verify evidence contract
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),a=require('assert/strict');
          global.window={}; global.document={readyState:'loading',addEventListener(){}};
          vm.runInThisContext(fs.readFileSync('atlas-exit/conflict-tensions.js','utf8'));
          const d=window.ATLAS_CONFLICT_TENSIONS;
          a.deepEqual(Object.fromEntries(Object.entries(d).map(([k,v])=>[k,v.category])),{USA:'Faible',THA:'Modéré',AUS:'Modéré',ESP:'Modéré',JPN:'Modéré',CHE:'Faible',SGP:'Modéré',CAN:'Modéré'});
          a.equal(d.THA.sources.length,2); a.equal(d.JPN.sources.length,4);
          a.equal(d.THA.multi_source_required,true); a.equal(d.JPN.multi_source_required,true);
          a.match(d.THA.geography,/Pattani/); a.match(d.THA.geography,/20 km/);
          a.match(d.JPN.context,/20 septembre 2026/); a.match(d.JPN.context,/440 km/);
          a.match(d.JPN.caveat,/hors ZEE/); a.match(d.JPN.caveat,/aucun dommage/);
          for(const [id,r] of Object.entries(d)){a.ok(r.as_of);a.ok(r.geography);a.ok(r.caveat);a.ok(r.freshness);a.ok(r.sources.length>=2,`${id} sources`)}
          JS
      - name: Install Chromium
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Real Chromium desktop/mobile gate
        run: |
          mkdir -p qa-artifacts
          python3 -m http.server 8000 >/tmp/atlas-http.log 2>&1 &
          pid=$!; trap 'kill $pid || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/atlas-exit/index.html >/dev/null && break; sleep 1; done
          cat >/tmp/qa.cjs <<'JS'
          const {chromium}=require('/tmp/pw/node_modules/playwright');
          const fs=require('fs'),a=require('assert/strict');
          const url='http://127.0.0.1:8000/atlas-exit/index.html';
          const checkpoints=[];
          function mark(v,s){checkpoints.push(`${v}: ${s}`);fs.writeFileSync('qa-artifacts/checkpoints.txt',checkpoints.join('\n')+'\n')}
          async function openCountry(page,id,name){
            await page.locator('#countrySearch').fill(name); await page.waitForTimeout(180);
            const row=page.locator(`#results [data-country="${id}"]`); a.equal(await row.count(),1,`${id} unique result`);
            await row.evaluate(el=>el.click());
            await page.waitForFunction(iso=>window.AtlasExplorer?.state?.selected===iso,id,{timeout:5000});
            const panel=page.locator(`#inspector [data-conflict-panel][data-country="${id}"]`);
            await panel.waitFor({state:'visible',timeout:8000});
            a.equal(await panel.evaluate(el=>el.parentElement?.classList.contains('inspector-body')),true,`${id} panel placement`);
            return panel;
          }
          (async()=>{
            const browser=await chromium.launch({headless:true}); const report=[];
            for(const cfg of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]){
              const context=await browser.newContext({viewport:{width:cfg.width,height:cfg.height}}); const page=await context.newPage();
              const errors=[],failed=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error'&&!/umami|ERR_FAILED|Failed to load resource|favicon/i.test(m.text()))errors.push(m.text())});
              page.on('requestfailed',r=>{try{if(new URL(r.url()).origin===new URL(url).origin)failed.push(r.url())}catch{}});
              try{
                await page.goto(url,{waitUntil:'domcontentloaded'});
                await page.waitForFunction(()=>window.AtlasExplorer?.ready?.()&&window.ATLAS_CONFLICT_TENSIONS?.JPN?.sources?.length===4,null,{timeout:15000}); mark(cfg.name,'boot');
                a.equal(await page.locator('[data-layer="explore"]').count(),0); a.equal(await page.locator('[data-layer="conflict"]').count(),1); a.match(await page.locator('[data-layer="stability"]').innerText(),/Stabilité politique/); mark(cfg.name,'semantic toolbar');

                await page.locator('#countrySearch').fill('Canada'); await page.waitForTimeout(180); await page.locator('#results [data-country="CAN"]').evaluate(el=>el.click());
                await page.waitForSelector('#inspector .atlas-evidence [data-evidence-field]');
                const ev=page.locator('#inspector .atlas-evidence').last();
                a.equal(await ev.locator('[data-evidence-field]').count(),8); a.ok((await ev.boundingBox()).height<720); a.equal(await ev.locator('.atlas-evidence__row > p').first().isVisible(),false);
                await page.locator('#inspector [data-dismiss]').evaluate(el=>el.click()); mark(cfg.name,'Canada readability retained');

                if(cfg.name==='mobile'){
                  const mb=page.locator('#mobileFilters'); await mb.evaluate(el=>el.click()); a.equal(await mb.getAttribute('aria-expanded'),'true');
                  await mb.evaluate(el=>el.click()); await page.waitForTimeout(220); a.equal(await mb.getAttribute('aria-expanded'),'false'); mark(cfg.name,'mobile filter open-close');
                }

                await page.locator('[data-layer="conflict"]').evaluate(el=>el.click()); await page.waitForFunction(()=>document.body.classList.contains('conflict-layer')); a.match(await page.locator('#mapLabel').innerText(),/CONFLIT & TENSIONS/); mark(cfg.name,'conflict layer');
                let p=await openCountry(page,'THA','Thaïlande'); a.equal(await p.locator('a.conflict-source').count(),2); let t=await p.innerText(); a.match(t,/Pattani/);a.match(t,/20 km/);a.match(t,/Bangkok/);a.match(t,/Phuket/);await page.locator('#inspector [data-dismiss]').evaluate(el=>el.click()); mark(cfg.name,'Thailand panel');
                p=await openCountry(page,'JPN','Japon'); a.equal(await p.locator('a.conflict-source').count(),4); let j=await p.innerText(); a.match(j,/20 septembre 2026/);a.match(j,/440 km/);a.match(j,/hors ZEE/);a.match(j,/aucun dommage/);await page.locator('#inspector [data-dismiss]').evaluate(el=>el.click()); mark(cfg.name,'Japan freshness panel');
                p=await openCountry(page,'CAN','Canada');a.equal(await p.locator('a.conflict-source').count(),2);await page.locator('#inspector [data-save="CAN"]').evaluate(el=>el.click());await page.locator('#inspector [data-dismiss]').evaluate(el=>el.click());
                p=await openCountry(page,'THA','Thaïlande');await page.locator('#inspector [data-save="THA"]').evaluate(el=>el.click());await page.locator('#inspector [data-dismiss]').evaluate(el=>el.click());a.equal((await page.locator('#savedCount').textContent()).trim(),'2'); mark(cfg.name,'save');

                const compare=page.locator('#openCompare'); a.equal(await compare.isDisabled(),false,'compare enabled with two saved countries'); await compare.evaluate(el=>el.click());
                await page.locator('#compareDialog').waitFor({state:'visible',timeout:5000});
                const row=page.locator('#compareTable [data-conflict-row]'); await row.waitFor({state:'visible',timeout:5000}); a.equal(await row.locator('td').count(),3); const cmp=await row.innerText();a.match(cmp,/modéré/i);a.match(cmp,/Pattani/);await page.locator('#compareDialog [data-close]').evaluate(el=>el.click()); mark(cfg.name,'comparator');

                await page.locator('[data-layer="stability"]').evaluate(el=>el.click());await page.waitForFunction(()=>!document.body.classList.contains('conflict-layer'));a.match(await page.locator('#mapLabel').innerText(),/BANQUE MONDIALE/);await page.locator('[data-layer="conflict"]').evaluate(el=>el.click());await page.waitForFunction(()=>document.body.classList.contains('conflict-layer')); mark(cfg.name,'layer switch regression');
                a.equal(await page.locator('#inspector').evaluate(el=>el.scrollWidth<=el.clientWidth+1),true); a.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true); a.deepEqual(errors,[]);a.deepEqual(failed,[]); mark(cfg.name,'overflow/errors clean');
                await page.screenshot({path:`qa-artifacts/${cfg.name}.png`,fullPage:false}); report.push({...cfg,ok:true});
              }catch(e){
                fs.writeFileSync(`qa-artifacts/failure-${cfg.name}.txt`,String(e.stack||e));
                await page.screenshot({path:`qa-artifacts/failure-${cfg.name}.png`,fullPage:false}).catch(()=>{}); throw e;
              }finally{await context.close()}
            }
            await browser.close(); fs.writeFileSync('qa-artifacts/report.json',JSON.stringify(report,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/qa.cjs
      - name: Push exact Product candidate after PASS
        env:
          LIVE: 2064d6f96b80156d19973d2332ee9f652d5a57ef
          PRODUCT_BRANCH: ops/atlas-pex-x1-fix3-20260923
        run: |
          head=$(git rev-parse HEAD)
          expected="$(printf '%s\n' atlas-exit/conflict-tensions.css atlas-exit/conflict-tensions.js atlas-exit/index.html | sort)"
          actual="$(git diff --name-only "$LIVE..$head" | sort)"
          test "$actual" = "$expected"
          git push -f origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          echo "$head" | tee qa-artifacts/product-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-pex-x1-fix3-qa
          path: qa-artifacts
          if-no-files-found: warn
