name: Atlas Explorer Hotfix QA

on:
  push:
    branches:
      - ops/atlas-explorer-hotfix-qa3-20260925
    paths:
      - .github/workflows/atlas-explorer-hotfix-qa.yml
      - scripts/atlas_explorer_hotfix_qa.cjs
      - scripts/atlas_explorer_hotfix_qa_v2.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact Product bytes
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=8204de08f06f9ba40c3212e8ed9085326ff34551
          test "$(git merge-base HEAD "$CANDIDATE")" = "$CANDIDATE"
          git diff --exit-code "$CANDIDATE" -- atlas-exit
          test "$(git hash-object atlas-exit/atlas-ui-explorer.css)" = "bb00d7f9b2bd0d2d7f32deace9ee93ff0a3106d8"
          test "$(git hash-object atlas-exit/conflict-tensions.css)" = "3d76745cc8268ae874f87efe6313021f15554bb8"
          test "$(git hash-object atlas-exit/script.js)" = "9e49cb253a06a0a87eca5eb4b0776cd887a508e6"
          test "$(git hash-object scripts/atlas_explorer_hotfix_qa.cjs)" = "f85beb4927d0c3be1890043a14f0e40a4aa3448e"
          test "$(git hash-object scripts/atlas_explorer_hotfix_qa_v2.cjs)" = "f85beb4927d0c3be1890043a14f0e40a4aa3448e"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve exact candidate tree
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/atlas-http.log 2>&1 &
          echo $! > /tmp/atlas-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/atlas-exit/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/atlas-http.log
          exit 1

      - name: Run exact Chromium gate
        env:
          ATLAS_BASE: http://127.0.0.1:8000/atlas-exit/index.html
        run: node scripts/atlas_explorer_hotfix_qa.cjs

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-explorer-hotfix-qa
          path: qa-artifacts/
          if-no-files-found: ignore
