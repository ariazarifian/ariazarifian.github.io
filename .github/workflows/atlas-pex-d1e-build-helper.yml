name: Atlas PEX-D1E Switzerland build helper
on:
  push:
    branches: [ops/atlas-pex-d1e-build-helper-20260922]
permissions:
  contents: write
jobs:
  patch-product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve helper and switch to Product branch
        run: |
          cp scripts/pex_d1e_patch.py /tmp/pex_d1e_patch.py
          git fetch origin ops/atlas-pex-d1e-switzerland-20260922
          git checkout -B ops/atlas-pex-d1e-switzerland-20260922 origin/ops/atlas-pex-d1e-switzerland-20260922
      - name: Patch and validate Product files
        run: |
          python3 /tmp/pex_d1e_patch.py
          node --check atlas-exit/fiscal-finalize.js
          node --check atlas-exit/country-evidence-switzerland.js
          git diff --check
          test "$(git diff --name-only HEAD -- atlas-exit | sort)" = "atlas-exit/fiscal-finalize.js"
      - name: Commit exact Product patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-exit/fiscal-finalize.js
          git commit -m 'PEX-D1E wire Switzerland evidence into Explorer'
          git push origin HEAD:refs/heads/ops/atlas-pex-d1e-switzerland-20260922
          echo "PRODUCT_HEAD=$(git rev-parse HEAD)"
